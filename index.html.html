<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>نمایشگر DXF</title>
<style>
:root{--bg:#14171c;--bar:#1e232b;--line:#313a47;--tx:#e8ecf2;--mut:#93a0b3;--acc:#3ea6ff;--ok:#33c27f;--warn:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,Vazirmatn,Tahoma,sans-serif;overscroll-behavior:none;font-size:14px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
button{font:inherit;color:inherit;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{background:#2a313c}
button.pri{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
button:disabled{opacity:.4}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--bar);border-bottom:1px solid var(--line)}
#fname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:12px;direction:ltr;text-align:center}
#wrap{flex:1;position:relative;min-height:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#fab{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#fab button{width:42px;height:42px;padding:0;font-size:20px;background:rgba(30,35,43,.92)}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--mut);line-height:1.9}
#empty b{color:var(--tx);font-size:18px}
#empty button{font-size:16px;padding:12px 22px}
#panel{background:var(--bar);border-top:1px solid var(--line);padding:8px 10px;max-height:44vh;overflow:auto;display:none}
.r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #28303b}
.r span{color:var(--mut)}
.r b{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;font-size:15px}
.r.big b{color:var(--warn);font-size:17px}
.hint,.sn{color:var(--mut);font-size:12.5px;padding:4px 0}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:84px;padding:9px 6px}
#tools{display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tools button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tools button i{font-style:normal;font-size:19px;line-height:1.1}
#tools button.on{color:var(--acc);background:#232b36}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet .box{background:var(--bar);width:100%;max-width:560px;max-height:78vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;border:1px solid var(--line)}
#sheet h3{margin:0 0 10px;font-size:16px}
.lr{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #28303b}
.lr .sw{width:16px;height:16px;border-radius:4px;border:1px solid #555;flex:none}
.lr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right;white-space:nowrap}
.lr .ct{color:var(--mut);font-size:12px}
.lr input[type=checkbox]{width:20px;height:20px}
select{font:inherit;background:#12161b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="pri" id="bOpen">📂 باز کردن</button>
    <div id="fname">—</div>
    <button id="bLayers">لایه‌ها</button>
    <button id="bSet">⚙</button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="fab">
      <button id="bFit" title="نمایش کامل">⤢</button>
      <button id="bIn">＋</button>
      <button id="bOut">−</button>
    </div>
    <div id="empty">
      <b>نمایشگر DXF (آفلاین)</b>
      <div>فایل <span dir="ltr">DXF</span> را از حافظه گوشی انتخاب کنید.<br>فایل <span dir="ltr">DWG</span> را ابتدا باید به <span dir="ltr">DXF</span> تبدیل کنید.</div>
      <button class="pri" id="bOpen2">📂 انتخاب فایل</button>
      <button id="bDemo">نمونه‌ی آزمایشی</button>
    </div>
  </div>
  <div id="panel"></div>
  <div id="tools">
    <button data-t="pan" class="on"><i>✋</i>حرکت</button>
    <button data-t="id"><i>📍</i>مختصات</button>
    <button data-t="dist"><i>📏</i>فاصله</button>
    <button data-t="area"><i>⬚</i>مساحت</button>
    <button data-t="angle"><i>∠</i>زاویه</button>
    <button data-t="prop"><i>ℹ️</i>ویژگی</button>
  </div>
</div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<input type="file" id="file" style="display:none">

<script>
/*PARSER_START*/
const D2R=Math.PI/180;
function hsv(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return (Math.round((r+m)*255)<<16)|(Math.round((g+m)*255)<<8)|Math.round((b+m)*255);}
function aciRGB(n){
  const base={1:0xff0000,2:0xffff00,3:0x00ff00,4:0x00ffff,5:0x0000ff,6:0xff00ff,7:0xffffff,8:0x808080,9:0xc0c0c0};
  if(base[n]!==undefined)return base[n];
  if(n>=250&&n<=255){const v=[51,91,132,173,214,255][n-250];return (v<<16)|(v<<8)|v}
  if(n>=10&&n<=249){const hue=Math.floor((n-10)/10)*15,k=(n-10)%10;return hsv(hue,(k%2)?0.5:1,[1,0.65,0.5,0.3,0.15][k>>1])}
  return 0xffffff;}
function mul(A,B){return [A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];}
function tr(M,x,y){return [M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]];}
function cleanT(s){return s.replace(/\\U\+([0-9A-Fa-f]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/%%[cC]/g,'Ø').replace(/%%[dD]/g,'°').replace(/%%[pP]/g,'±').replace(/%%[uUoO]/g,'');}
function cleanMT(s){return cleanT(s).replace(/\\P/g,'\n').replace(/\\S([^;^\/#]*)[\^\/#]([^;]*);/g,'$1/$2').replace(/\\[Ff][^;]*;/g,'').replace(/\\[HhWwQqTtAaCc][^;]*;/g,'').replace(/\\[LlOoKk]/g,'').replace(/\\~/g,' ').replace(/\\\\/g,'\\').replace(/[{}]/g,'');}
function bulgePts(x1,y1,x2,y2,b){
  const d=Math.hypot(x2-x1,y2-y1);if(d<1e-12||Math.abs(b)<1e-12)return [];
  const a=(d/2)*(1-b*b)/(2*b),nx=-(y2-y1)/d,ny=(x2-x1)/d,cx=(x1+x2)/2+nx*a,cy=(y1+y2)/2+ny*a;
  const r=Math.hypot(x1-cx,y1-cy),a0=Math.atan2(y1-cy,x1-cx),sw=4*Math.atan(b);
  const n=Math.max(2,Math.ceil(Math.abs(sw)/(Math.PI/48)));const o=[];
  for(let i=1;i<n;i++){const t=a0+sw*i/n;o.push(cx+r*Math.cos(t),cy+r*Math.sin(t))}return o;}
function deBoor(deg,knots,ctrl){
  const n=ctrl.length,out=[];
  if(knots.length!==n+deg+1||n<deg+1)return ctrl.map(c=>c.slice());
  const t0=knots[deg],t1=knots[n],N=Math.max(24,Math.min(3000,n*14));
  for(let i=0;i<=N;i++){
    let t=t0+(t1-t0)*i/N;if(i===N)t=t1-1e-9*(t1-t0||1);
    let k=deg;while(k<n-1&&knots[k+1]<=t)k++;
    const d=[];for(let j=0;j<=deg;j++)d.push(ctrl[k-deg+j].slice());
    for(let r=1;r<=deg;r++)for(let j=deg;j>=r;j--){
      const den=knots[j+1+k-r]-knots[j+k-deg],al=den===0?0:(t-knots[j+k-deg])/den;
      for(let q=0;q<3;q++)d[j][q]=(1-al)*d[j-1][q]+al*d[j][q];}
    out.push(d[deg]);}
  return out;}

function parseDXF(text){
  const Ls=text.split(/\r\n|\r|\n/);
  const codes=[],vals=[];
  for(let i=0;i+1<Ls.length;){
    if(!/^\s*-?\d+\s*$/.test(Ls[i])){i++;continue}
    codes.push(parseInt(Ls[i],10));vals.push(Ls[i+1]);i+=2;}
  const N=codes.length;
  const items={TABLES:[],BLOCKS:[],ENTITIES:[]};let curSec=null,units=0,i=0;
  while(i<N){
    if(codes[i]===0){
      const t=vals[i].trim();
      if(t==='SECTION'){curSec=(i+1<N&&codes[i+1]===2)?vals[i+1].trim():null;i+=2;continue}
      if(t==='ENDSEC'){curSec=null;i++;continue}
      if(t==='EOF')break;
      let j=i+1;while(j<N&&codes[j]!==0)j++;
      if(curSec&&items[curSec])items[curSec].push({t,s:i+1,e:j});
      i=j;continue;}
    if(curSec==='HEADER'&&codes[i]===9&&vals[i].trim()==='$INSUNITS'&&i+1<N)units=parseInt(vals[i+1])||0;
    i++;}
  const gs=(it,c)=>{for(let k=it.s;k<it.e;k++)if(codes[k]===c)return vals[k];return undefined};
  const gf=(it,c,d)=>{const v=gs(it,c);if(v===undefined)return d;const x=parseFloat(v);return isNaN(x)?d:x};
  const layers={};
  const getLayer=n=>layers[n]||(layers[n]={name:n,color:0xffffff,on:true,count:0});
  for(const it of items.TABLES){if(it.t!=='LAYER')continue;
    const L=getLayer((gs(it,2)||'0').trim()),aci=gf(it,62,7),fl=gf(it,70,0),tc=gs(it,420);
    L.color=tc!==undefined?(parseInt(tc)&0xffffff):aciRGB(Math.abs(aci));
    L.on=aci>=0&&!(fl&1);}
  const blocks={};let cb=null;
  for(const it of items.BLOCKS){
    if(it.t==='BLOCK'){cb={name:(gs(it,2)||'').trim(),bx:gf(it,10,0),by:gf(it,20,0),items:[]};blocks[cb.name]=cb}
    else if(it.t==='ENDBLK')cb=null;else if(cb)cb.items.push(it);}
  const prims=[],texts=[],sx=[],sy=[],sz=[],st=[],sl=[],skipped={};
  const SILENT={SEQEND:1,VERTEX:1,ATTDEF:1,HATCH:1,VIEWPORT:1,XLINE:1,RAY:1,IMAGE:1,MLINE:1,MLEADER:1,WIPEOUT:1,OLE2FRAME:1};
  function style(it,ctx){
    let ln=gs(it,8);ln=ln===undefined?'0':ln.trim();if(ln==='0'&&ctx.layer)ln=ctx.layer;
    const L=getLayer(ln),tc=gs(it,420),aci=gf(it,62,256);let col;
    if(tc!==undefined)col=parseInt(tc)&0xffffff;else if(aci===256)col=L.color;else if(aci===0)col=ctx.color;else col=aciRGB(Math.abs(aci));
    return {L,col};}
  function addSnap(sty,x,y,z,t){sx.push(x);sy.push(y);sz.push(z);st.push(t);sl.push(sty.L)}
  function addPoly(flat,closed,sty,type,snaps,extra){
    let x0=1e300,y0=1e300,x1=-1e300,y1=-1e300;
    for(let i=0;i<flat.length;i+=2){const x=flat[i],y=flat[i+1];if(!(isFinite(x)&&isFinite(y)))return;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    const info=extra||{};info.type=type;
    prims.push({pts:flat,closed,L:sty.L,col:sty.col,bb:[x0,y0,x1,y1],info});sty.L.count++;
    if(snaps)for(const q of snaps)addSnap(sty,q[0],q[1],q[2],q[3]);}
  function ocs(it,M){
    const ex=gf(it,210,0),ey=gf(it,220,0),ez=gf(it,230,1);if(ex===0&&ey===0&&ez>0)return M;
    const nl=Math.hypot(ex,ey,ez)||1,zx=ex/nl,zy=ey/nl,zz=ez/nl;let ax,ay,az;
    if(Math.abs(zx)<1/64&&Math.abs(zy)<1/64){ax=zz;ay=0;az=-zx}else{ax=-zy;ay=zx;az=0}
    const al=Math.hypot(ax,ay,az)||1;ax/=al;ay/=al;az/=al;
    return mul(M,[ax,ay,zy*az-zz*ay,zz*ax-zx*az,0,0]);}
  function polyFromVerts(v,closed,M,z,sty,type){
    const n=v.length;if(n<2)return;const flat=[],snaps=[];
    const segs=closed?n:n-1;
    for(let i=0;i<segs;i++){
      const p1=v[i],p2=v[(i+1)%n],a=tr(M,p1.x,p1.y);flat.push(a[0],a[1]);
      const zz=(p1.z!==undefined?p1.z:z);snaps.push([a[0],a[1],zz,'e']);
      if(p1.b){const ip=bulgePts(p1.x,p1.y,p2.x,p2.y,p1.b);for(let k=0;k<ip.length;k+=2){const q=tr(M,ip[k],ip[k+1]);flat.push(q[0],q[1])}}
      else{const b=tr(M,p2.x,p2.y);snaps.push([(a[0]+b[0])/2,(a[1]+b[1])/2,zz,'m'])}}
    if(!closed){const p=v[n-1],a=tr(M,p.x,p.y);flat.push(a[0],a[1]);snaps.push([a[0],a[1],p.z!==undefined?p.z:z,'e'])}
    addPoly(flat,closed,sty,type,snaps);}
  function doText(it,ctx,mt){
    if(it.t==='ATTRIB'&&(gf(it,70,0)&1))return;
    const sty=style(it,ctx);let str,x,y,h,rot,ah='left',av='alphabetic',M2,ix,iy;
    if(mt){let s='';for(let k=it.s;k<it.e;k++)if(codes[k]===3)s+=vals[k];s+=gs(it,1)||'';str=cleanMT(s);
      x=ix=gf(it,10,0);y=iy=gf(it,20,0);h=gf(it,40,1);M2=ctx.M;
      const dx=gs(it,11);rot=dx!==undefined?Math.atan2(gf(it,21,0),parseFloat(dx)):gf(it,50,0)*D2R;
      const ap=gf(it,71,1);ah=['left','center','right'][((ap-1)%3+3)%3];av=ap<=3?'top':ap<=6?'middle':'bottom';}
    else{str=cleanT(gs(it,1)||'');M2=ocs(it,ctx.M);ix=gf(it,10,0);iy=gf(it,20,0);
      const a72=gf(it,72,0),a73=gf(it,73,0);
      if(a72||a73){x=gf(it,11,ix);y=gf(it,21,iy)}else{x=ix;y=iy}
      h=gf(it,40,1);rot=gf(it,50,0)*D2R;ah=(a72===1||a72===4)?'center':a72===2?'right':'left';
      av=a73===1?'bottom':a73===2?'middle':a73===3?'top':'alphabetic';if(a72===4)av='middle';}
    if(!str.trim())return;
    const p=tr(M2,x,y),sc=Math.sqrt(Math.abs(M2[0]*M2[3]-M2[1]*M2[2]))||1;
    if(!(isFinite(p[0])&&isFinite(p[1])))return;
    texts.push({x:p[0],y:p[1],h:h*sc,rot:rot+Math.atan2(M2[1],M2[0]),s:str,col:sty.col,L:sty.L,ah,av});sty.L.count++;
    const q=tr(M2,ix,iy);addSnap(sty,q[0],q[1],gf(it,30,0)+ctx.z,'i');}
  function doInsert(it,ctx,sty,isDim){
    const blk=blocks[(gs(it,2)||'').trim()];if(!blk||ctx.depth>8)return;
    if(isDim){convert(blk.items,{M:ctx.M,color:sty.col,layer:sty.L.name,depth:ctx.depth+1,z:ctx.z});return}
    const M0=ocs(it,ctx.M),ix=gf(it,10,0),iy=gf(it,20,0),iz=gf(it,30,0);
    const sxx=gf(it,41,1),syy=gf(it,42,1),rot=gf(it,50,0)*D2R;
    const nc=Math.max(1,gf(it,70,1)|0),nr=Math.max(1,gf(it,71,1)|0),dc=gf(it,44,0),dr=gf(it,45,0);
    if(nc*nr>5000)return;
    const c=Math.cos(rot),s=Math.sin(rot);
    for(let r=0;r<nr;r++)for(let q=0;q<nc;q++){
      let Mi=mul(M0,[1,0,0,1,ix,iy]);Mi=mul(Mi,[c,s,-s,c,0,0]);Mi=mul(Mi,[1,0,0,1,q*dc,r*dr]);
      Mi=mul(Mi,[sxx,0,0,syy,0,0]);Mi=mul(Mi,[1,0,0,1,-blk.bx,-blk.by]);
      if(ctx.depth===0){const p=tr(Mi,blk.bx,blk.by);addSnap(sty,p[0],p[1],iz+ctx.z,'i')}
      convert(blk.items,{M:Mi,color:sty.col,layer:sty.L.name,depth:ctx.depth+1,z:ctx.z+iz});}}
  function convert(list,ctx){
    for(let k=0;k<list.length;k++){
      const it=list[k];
      if(ctx.depth===0&&gf(it,67,0)===1)continue;
      switch(it.t){
      case 'LINE':{const sty=style(it,ctx),M=ctx.M,a=tr(M,gf(it,10,0),gf(it,20,0)),b=tr(M,gf(it,11,0),gf(it,21,0));
        const z1=gf(it,30,0)+ctx.z,z2=gf(it,31,0)+ctx.z;
        addPoly([a[0],a[1],b[0],b[1]],false,sty,'LINE',[[a[0],a[1],z1,'e'],[b[0],b[1],z2,'e'],[(a[0]+b[0])/2,(a[1]+b[1])/2,(z1+z2)/2,'m']],{z:[z1,z2]});break}
      case 'LWPOLYLINE':{const sty=style(it,ctx),v=[];
        for(let q=it.s;q<it.e;q++){const c=codes[q];
          if(c===10)v.push({x:parseFloat(vals[q]),y:0,b:0});else if(c===20&&v.length)v[v.length-1].y=parseFloat(vals[q]);else if(c===42&&v.length)v[v.length-1].b=parseFloat(vals[q])}
        polyFromVerts(v,!!(gf(it,70,0)&1),ocs(it,ctx.M),gf(it,38,0)+ctx.z,sty,'LWPOLYLINE');break}
      case 'POLYLINE':{const vs=[];let m=k+1;while(m<list.length&&list[m].t==='VERTEX'){vs.push(list[m]);m++}
        if(m<list.length&&list[m].t==='SEQEND')m++;k=m-1;
        const fl=gf(it,70,0);if(fl&(16|64))break;const sty=style(it,ctx),is3=!!(fl&8);
        const v=[];for(const q of vs){if(gf(q,70,0)&16)continue;v.push({x:gf(q,10,0),y:gf(q,20,0),b:gf(q,42,0),z:is3?gf(q,30,0)+ctx.z:undefined})}
        polyFromVerts(v,!!(fl&1),is3?ctx.M:ocs(it,ctx.M),gf(it,30,0)+ctx.z,sty,is3?'POLYLINE3D':'POLYLINE');break}
      case 'CIRCLE':{const sty=style(it,ctx),M=ocs(it,ctx.M),cx=gf(it,10,0),cy=gf(it,20,0),r=gf(it,40,0);if(!(r>0))break;
        const n=192,flat=[];for(let q=0;q<n;q++){const t=2*Math.PI*q/n,p=tr(M,cx+r*Math.cos(t),cy+r*Math.sin(t));flat.push(p[0],p[1])}
        const c=tr(M,cx,cy),sc=Math.sqrt(Math.abs(M[0]*M[3]-M[1]*M[2]))||1;
        addPoly(flat,true,sty,'CIRCLE',[[c[0],c[1],gf(it,30,0)+ctx.z,'c']],{r:r*sc,area:Math.PI*r*sc*r*sc,len:2*Math.PI*r*sc});break}
      case 'ARC':{const sty=style(it,ctx),M=ocs(it,ctx.M),cx=gf(it,10,0),cy=gf(it,20,0),r=gf(it,40,0);if(!(r>0))break;
        const a0=gf(it,50,0)*D2R;let sw=gf(it,51,360)*D2R-a0;while(sw<=0)sw+=2*Math.PI;
        const n=Math.max(4,Math.ceil(sw/(2*Math.PI)*192)),flat=[];
        for(let q=0;q<=n;q++){const t=a0+sw*q/n,p=tr(M,cx+r*Math.cos(t),cy+r*Math.sin(t));flat.push(p[0],p[1])}
        const z=gf(it,30,0)+ctx.z,c=tr(M,cx,cy),mm=tr(M,cx+r*Math.cos(a0+sw/2),cy+r*Math.sin(a0+sw/2)),sc=Math.sqrt(Math.abs(M[0]*M[3]-M[1]*M[2]))||1;
        addPoly(flat,false,sty,'ARC',[[c[0],c[1],z,'c'],[flat[0],flat[1],z,'e'],[flat[flat.length-2],flat[flat.length-1],z,'e'],[mm[0],mm[1],z,'m']],{r:r*sc,len:r*sc*sw});break}

function zoomBy(k){view.s=Math.max(1e-9,Math.min(1e9,view.s*k));req()}
function zoomExtents(){
  if(!DB)return;let x0=1e300,y0=1e300,x1=-1e300,y1=-1e300,any=false;
  for(const p of DB.prims){if(!p.L.on)continue;const b=p.bb;x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3]);any=true}
  for(const t of DB.texts){if(!t.L.on)continue;x0=Math.min(x0,t.x);y0=Math.min(y0,t.y);x1=Math.max(x1,t.x);y1=Math.max(y1,t.y);any=true}
  if(!any)return;const w=x1-x0,h=y1-y0;
  view.s=(w<1e-9&&h<1e-9)?1:Math.min(W/Math.max(w,1e-9),H/Math.max(h,1e-9))*0.92;
  view.cx=(x0+x1)/2;view.cy=(y0+y1)/2;req()}

/* ---- tools ---- */
const f=v=>Number(v).toFixed(S.dec);
const dmsStr=a=>{let d=Math.floor(a),m=Math.floor((a-d)*60),s=((a-d)*60-m)*60;if(s>=59.995){s=0;m++}if(m>=60){m=0;d++}return d+'° '+m+"' "+s.toFixed(1)+'"'};
const gon=a=>(a*400/360).toFixed(4)+' gon';
const snapName=t=>({e:'snap: نقطه انتها / رأس',m:'snap: نقطه وسط',c:'snap: مرکز',i:'snap: نقطه درج / متن',n:'snap: نقطه (POINT)'}[t]||'بدون snap (نقطه‌ی آزاد)');
const row=(k,v,c='')=>`<div class="r ${c}"><span>${k}</span><b dir="ltr">${v}</b></div>`;
const btns=a=>'<div class="btns">'+a.map(([act,l,dis,pri])=>`<button data-a="${act}" class="${pri?'pri':''}" ${dis?'disabled':''}>${l}</button>`).join('')+'</div>';
function seg(a,b){const dx=b.x-a.x,dy=b.y-a.y;let az=Math.atan2(dx,dy)*180/Math.PI;if(az<0)az+=360;return {dx,dy,d:Math.hypot(dx,dy),az,dz:(b.z||0)-(a.z||0)}}
function polyArea(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s)/2}
function entInfo(p){const P=p.pts,n=P.length;let len=p.info.len;
  if(len===undefined){len=0;const m=p.closed?n:n-2;for(let i=0;i<m;i+=2){const j=(i+2)%n;len+=Math.hypot(P[j]-P[i],P[j+1]-P[i+1])}}
  let area=p.info.area;if(area===undefined&&p.closed&&n>=6){const q=[];for(let i=0;i<n;i+=2)q.push({x:P[i],y:P[i+1]});area=polyArea(q)}
  return {len,area}}
function renderPanel(){
  const P=$('panel');if(tool==='pan'||!DB){P.style.display='none';return}
  P.style.display='block';const {pts,tent,log}=curState();const live=tent?pts.concat([tent]):pts.slice();let h='';
  const u=UNITS[DB.units]||'';
  if(tool==='id'){
    if(tent){h+=row('X',f(tent.x))+row('Y',f(tent.y))+row('Z',f(tent.z))+`<div class="sn">${snapName(tent.t)}</div>`}
    else h+='<div class="hint">روی نقشه ضربه بزنید تا مختصات نقطه نمایش داده شود (با snap به نقاط مهم)</div>';
    if(log.length)h+=`<div class="sn">لیست ذخیره‌شده: ${log.length} نقطه</div>`;
    h+=btns([['logadd','＋ ثبت در لیست',!tent,1],['copy','کپی',!tent&&!log.length],['clear','پاک‌کردن لیست',!log.length]]);}
  else if(tool==='dist'){
    if(live.length<2)h+=`<div class="hint">نقطه‌ی ${live.length+1} را انتخاب کنید، سپس «ثبت نقطه» را بزنید</div>`;
    else{const a=live[live.length-2],b=live[live.length-1],s=seg(a,b);let tot=0;for(let i=1;i<live.length;i++)tot+=seg(live[i-1],live[i]).d;
      h+=row('فاصله‌ی افقی '+(u?'('+u+')':''),f(s.d),'big')+row('ΔX',f(s.dx))+row('ΔY',f(s.dy))+row('آزیموت',dmsStr(s.az))+row('آزیموت (گون)',gon(s.az));
      if(Math.abs(s.dz)>1e-9)h+=row('ΔZ',f(s.dz))+row('فاصله‌ی مایل',f(Math.hypot(s.d,s.dz)))+row('شیب',(s.dz/s.d*100).toFixed(2)+' %');
      if(live.length>2)h+=row('طول کل مسیر',f(tot),'big');}
    h+=btns([['confirm','✓ ثبت نقطه',!tent,1],['undo','↶ حذف آخرین',!pts.length],['copy','کپی',live.length<2],['clear','شروع مجدد',!pts.length&&!tent]]);}
  else if(tool==='area'){
    if(live.length<3)h+=`<div class="hint">حداقل ۳ نقطه برای مساحت لازم است (فعلاً ${live.length})</div>`;
    else{let per=0;for(let i=0;i<live.length;i++)per+=seg(live[i],live[(i+1)%live.length]).d;
      h+=row('مساحت '+(u?'('+u+'²)':''),f(polyArea(live)),'big')+row('محیط',f(per))+row('تعداد نقاط',live.length);}
    h+=btns([['confirm','✓ ثبت نقطه',!tent,1],['undo','↶ حذف آخرین',!pts.length],['copy','کپی',live.length<3],['clear','شروع مجدد',!pts.length&&!tent]]);}
  else if(tool==='angle'){
    if(live.length<3)h+=`<div class="hint">نقطه‌ی ۱، سپس رأس زاویه (نقطه‌ی ۲)، سپس نقطه‌ی ۳ (الان: ${live.length})</div>`;
    else{const s1=seg(live[1],live[0]),s2=seg(live[1],live[2]);let cw=s2.az-s1.az;if(cw<0)cw+=360;const sm=cw>180?360-cw:cw;
      h+=row('زاویه‌ی ساعتگرد (۱→۳)',dmsStr(cw),'big')+row('(گون)',gon(cw))+row('زاویه‌ی کوچک‌تر',dmsStr(sm))+row('(اعشاری)',sm.toFixed(5)+'°');}
    h+=btns([['confirm','✓ ثبت نقطه',!tent,1],['undo','↶ حذف آخرین',!pts.length],['clear','شروع مجدد',!pts.length&&!tent]]);}
  else if(tool==='prop'){
    if(!sel)h+='<div class="hint">روی یک خط، پلی‌لاین، دایره یا کمان ضربه بزنید</div>';
    else{const i=entInfo(sel);h+=row('نوع',sel.info.type)+row('لایه',sel.L.name);
      if(sel.info.r!==undefined)h+=row('شعاع',f(sel.info.r));
      h+=row('طول '+(sel.info.type==='POINT'?'':'(محیط اگر بسته)'),f(i.len),'big');
      if(i.area!==undefined)h+=row('مساحت',f(i.area),'big');
      if(sel.info.z&&sel.info.z.length===2&&Math.abs(sel.info.z[1]-sel.info.z[0])>1e-9)h+=row('طول مایل (۳بعدی)',f(Math.hypot(i.len,sel.info.z[1]-sel.info.z[0])));
      if(sel.info.type==='POINT')h+=row('X',f(sel.pts[0]))+row('Y',f(sel.pts[1]))+row('Z',f(sel.info.z[0]));}
    h+=btns([['copy','کپی',!sel],['clear','لغو انتخاب',!sel]]);}
  P.innerHTML=h;}
function copyText(){
  const live=tent?pts.concat([tent]):pts.slice();let t='';
  if(tool==='id'){const L=log.length?log:(tent?[tent]:[]);t=L.map((p,i)=>`${i+1}\t${f(p.x)}\t${f(p.y)}\t${f(p.z)}`).join('\n')}
  else if(tool==='dist'&&live.length>=2){const s=seg(live[live.length-2],live[live.length-1]);t=`dist\t${f(s.d)}\tdx\t${f(s.dx)}\tdy\t${f(s.dy)}\taz\t${s.az.toFixed(5)}`}
  else if(tool==='area'&&live.length>=3)t='area\t'+f(polyArea(live));
  else if(tool==='prop'&&sel){const i=entInfo(sel);t=`${sel.info.type}\t${sel.L.name}\tlen\t${f(i.len)}`+(i.area!==undefined?`\tarea\t${f(i.area)}`:'')}
  if(!t)return;
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).catch(fb);else fb();
  flash('کپی شد');}
function flash(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#33c27f;color:#04210f;padding:6px 14px;border-radius:20px;font-weight:700;z-index:20';document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function onTap(x,y){
  if(!DB||tool==='pan')return;
  if(tool==='prop'){sel=pickEntity(x,y)}else{tent=snapAt(x,y);hover=null}
  renderPanel();req()}
$('panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(a==='confirm'&&tent){if(tool==='angle'&&pts.length>=3)pts=[];pts.push(tent);tent=null}
  else if(a==='logadd'&&tent){log.push(tent);tent=null}
  else if(a==='undo'){pts.pop();tent=null}
  else if(a==='clear'){pts=[];tent=null;sel=null;if(tool==='id')log=[]}
  else if(a==='copy')copyText();
  renderPanel();req()});
document.querySelectorAll('#tools button').forEach(b=>b.addEventListener('click',()=>{
  tool=b.dataset.t;pts=[];tent=null;sel=null;hover=null;
  document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('on',x===b));renderPanel();req()}));
$('bFit').onclick=zoomExtents;$('bIn').onclick=()=>zoomBy(1.6);$('bOut').onclick=()=>zoomBy(1/1.6);

/* ---- sheets ---- */
function openSheet(h){$('sheetBox').innerHTML=h;$('sheet').style.display='flex'}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('sheet').style.display='none'});
function msg(title,body){openSheet(`<h3>${title}</h3><div style="line-height:2">${body}</div><div class="btns"><button class="pri" onclick="document.getElementById('sheet').style.display='none'">باشه</button></div>`)}
$('bLayers').onclick=()=>{
  if(!DB)return msg('لایه‌ها','ابتدا یک فایل باز کنید.');
  let h='<h3>لایه‌ها</h3><div class="btns"><button id="lAll">همه</button><button id="lNone">هیچ‌کدام</button></div>';
  DB.layers.forEach((L,i)=>{h+=`<label class="lr"><input type="checkbox" data-i="${i}" ${L.on?'checked':''}><span class="sw" style="background:${dispCol(L.color)}"></span><span class="nm">${L.name.replace(/</g,'&lt;')}</span><span class="ct">${L.count}</span></label>`});
  openSheet(h);
  const sync=()=>{document.querySelectorAll('#sheetBox input[data-i]').forEach(c=>{DB.layers[c.dataset.i].on=c.checked});req()};
  $('sheetBox').onchange=sync;
  $('lAll').onclick=()=>{DB.layers.forEach(L=>L.on=true);document.querySelectorAll('#sheetBox input[data-i]').forEach(c=>c.checked=true);req()};
  $('lNone').onclick=()=>{DB.layers.forEach(L=>L.on=false);document.querySelectorAll('#sheetBox input[data-i]').forEach(c=>c.checked=false);req()};};
$('bSet').onclick=()=>{
  openSheet(`<h3>تنظیمات</h3>
  <div class="lr"><span class="nm" style="text-align:right;direction:rtl">تعداد رقم اعشار</span><select id="sDec">${[0,1,2,3,4,5,6].map(n=>`<option ${n===S.dec?'selected':''}>${n}</option>`).join('')}</select></div>
  <label class="lr"><input type="checkbox" id="sSnap" ${S.snap?'checked':''}><span class="nm" style="direction:rtl;text-align:right">فعال بودن Snap</span></label>
  <label class="lr"><input type="checkbox" id="sE" ${S.snapE?'checked':''}><span class="nm" style="direction:rtl;text-align:right">Snap به انتها / رأس / نقطه‌ی درج</span></label>
  <label class="lr"><input type="checkbox" id="sM" ${S.snapM?'checked':''}><span class="nm" style="direction:rtl;text-align:right">Snap به وسط</span></label>
  <label class="lr"><input type="checkbox" id="sC" ${S.snapC?'checked':''}><span class="nm" style="direction:rtl;text-align:right">Snap به مرکز دایره/کمان</span></label>
  <label class="lr"><input type="checkbox" id="sD" ${S.dark?'checked':''}><span class="nm" style="direction:rtl;text-align:right">پس‌زمینه‌ی تیره</span></label>`);
  const b=$('sheetBox');b.onchange=()=>{S.dec=+$('sDec').value;S.snap=$('sSnap').checked;S.snapE=$('sE').checked;S.snapM=$('sM').checked;S.snapC=$('sC').checked;S.dark=$('sD').checked;renderPanel();req()}};

/* ---- file ---- */
function setDB(d,name){DB=d;fileName=name;tool='pan';pts=[];tent=null;log=[];sel=null;hover=null;
  document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('on',x.dataset.t==='pan'));
  $('fname').textContent=name;$('empty').style.display='none';renderPanel();resize();zoomExtents();
  const sk=Object.entries(d.skipped);
  if(!d.prims.length&&!d.texts.length)msg('خالی','موجودیت قابل نمایشی پیدا نشد.'+(sk.length?'<br>نوع‌های پشتیبانی‌نشده: <span dir="ltr">'+sk.map(([k,v])=>k+'×'+v).join(', ')+'</span>':''));
  else if(sk.length)flash('بعضی موجودیت‌ها نمایش داده نشد: '+sk.map(([k])=>k).join(', '))}
function openBuffer(buf,name){
  const u8=new Uint8Array(buf),head=String.fromCharCode.apply(null,u8.subarray(0,22));
  if(head.startsWith('AutoCAD Binary DXF'))return msg('DXF باینری','این DXF از نوع باینری است. هنگام ذخیره/تبدیل، گزینه‌ی <b>ASCII DXF</b> را انتخاب کنید.');
  if(/^AC10\d\d/.test(head))return msg('فایل DWG است','مرورگر نمی‌تواند DWG را مستقیم باز کند. فایل را با <b>ODA File Converter</b> (رایگان، روی کامپیوتر) یا هر مبدل دیگر به <b>ASCII DXF</b> (ترجیحاً نسخه‌ی R2000 یا 2004) تبدیل کنید و همان را اینجا باز کنید.');
  let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(u8)}catch(_){try{text=new TextDecoder('windows-1256').decode(u8)}catch(__){text=new TextDecoder('utf-8').decode(u8)}}
  if(!/^\s*0\s*\n\s*SECTION/m.test(text.slice(0,2000)))return msg('فرمت نامعتبر','این فایل شبیه DXF متنی نیست.');
  setDB(parseDXF(text),name);}
function loadFile(file){
  flash('در حال بارگذاری…');const fr=new FileReader();
  fr.onload=()=>setTimeout(()=>{try{openBuffer(fr.result,file.name)}catch(err){msg('خطا در خواندن فایل',String(err&&err.message||err))}},30);
  fr.onerror=()=>msg('خطا','فایل خوانده نشد.');fr.readAsArrayBuffer(file)}
$('file').addEventListener('change',e=>{const fl=e.target.files[0];if(fl)loadFile(fl);e.target.value=''});
$('bOpen').onclick=$('bOpen2').onclick=()=>$('file').click();
$('bDemo').onclick=()=>{
  const P=[[0,'SECTION'],[2,'ENTITIES'],[0,'LINE'],[8,'محور'],[62,1],[10,0],[20,0],[11,100],[21,0],
  [0,'LWPOLYLINE'],[8,'ساختمان'],[62,3],[90,4],[70,1],[10,10],[20,10],[10,60],[20,10],[10,60],[20,50],[10,10],[20,50],
  [0,'CIRCLE'],[8,'درخت'],[62,5],[10,80],[20,30],[40,15],
  [0,'ARC'],[8,'محور'],[62,2],[10,30],[20,70],[40,20],[50,0],[51,180],
  [0,'POINT'],[8,'نقاط'],[62,6],[10,95],[20,60],[30,12.5],
  [0,'TEXT'],[8,'متن'],[62,7],[10,12],[20,54],[40,4],[1,'Building A'],
  [0,'ENDSEC'],[0,'EOF']];
  setDB(parseDXF(P.map(p=>p.join('\n')).join('\n')),'نمونه.dxf')};
resize();
</script>
