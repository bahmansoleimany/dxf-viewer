<style>
:root{--bg:#14171c;--bar:#1e232b;--line:#313a47;--tx:#e8ecf2;--mut:#93a0b3;--acc:#3ea6ff;--ok:#33c27f;--warn:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,Vazirmatn,Tahoma,sans-serif;overscroll-behavior:none;font-size:14px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
button{font:inherit;color:inherit;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{background:#2a313c}
button.pri{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
button:disabled{opacity:.4}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--bar);border-bottom:1px solid var(--line)}
#fname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:12px;direction:ltr;text-align:center}
#wrap{flex:1;position:relative;min-height:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;top:0;left:0;touch-action:none;display:block}
#fab{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#fab button{width:42px;height:42px;padding:0;font-size:20px;background:rgba(30,35,43,.92)}
#empty{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--mut);line-height:1.9}
#empty b{color:var(--tx);font-size:18px}
#empty button{font-size:16px;padding:12px 22px}
#panel{background:var(--bar);border-top:1px solid var(--line);padding:8px 10px;max-height:44vh;overflow:auto;display:none}
.r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #28303b}
.r span{color:var(--mut)}
.r b{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;font-size:15px}
.r.big b{color:var(--warn);font-size:17px}
.hint,.sn{color:var(--mut);font-size:12.5px;padding:4px 0}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:84px;padding:9px 6px}
#tools{display:flex;overflow-x:auto;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools .sep{flex:0 0 1px;background:var(--line);margin:6px 2px}
#tools button{flex:1 0 auto;min-width:62px;border:0;border-radius:0;background:transparent;padding:8px 6px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
#tools button i{font-style:normal;font-size:19px;line-height:1.1}
#tools button.on{color:var(--acc);background:#232b36}
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet .box{background:var(--bar);width:100%;max-width:560px;max-height:78vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;border:1px solid var(--line)}
#sheet h3{margin:0 0 10px;font-size:16px}
.lr{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #28303b}
.lr .sw{width:16px;height:16px;border-radius:4px;border:1px solid #555;flex:none}
.lr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right;white-space:nowrap}
.lr .ct{color:var(--mut);font-size:12px}
.lr input[type=checkbox]{width:20px;height:20px}
select{font:inherit;background:#12161b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px}
input[type=text],input[type=number]{font:inherit;font-size:16px;background:#12161b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;direction:rtl}
.fl{display:flex;gap:8px;align-items:center;margin-top:8px}.fl label{color:var(--mut);white-space:nowrap}
#brand{width:96px;height:96px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.ver{color:var(--mut);font-size:12px;line-height:1.9;padding-top:8px}
#chips{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#chips button{padding:5px 11px;font-size:12px;border-radius:16px;background:rgba(30,35,43,.92)}
#chips button.on{background:var(--ok);color:#04210f;border-color:var(--ok);font-weight:700}
#sub{display:none;overflow-x:auto;background:#232b36;border-top:1px solid var(--line);scrollbar-width:none}
#sub::-webkit-scrollbar{display:none}
#sub button{flex:1 0 auto;min-width:78px;border:0;border-radius:0;background:transparent;padding:9px 8px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
#sub button i{font-style:normal;font-size:19px;line-height:1.1}
#sub button.on{color:var(--acc);background:#2c3644}
#tools button.open{background:#232b36}
#tools sup{font-size:9px;margin-right:2px;vertical-align:top}
#top{position:relative}
#ver{position:absolute;left:5px;top:max(1px,env(safe-area-inset-top));font-size:9px;color:var(--mut);opacity:.75;pointer-events:none;direction:ltr}
.grab{height:16px;margin:-6px 0 2px;position:relative;touch-action:none;cursor:pointer}
.grab::after{content:'';position:absolute;left:50%;top:6px;width:46px;height:4px;margin-left:-23px;border-radius:3px;background:#56627a}
#panel.min>*:not(.btns):not(.grab):not(.keep){display:none}
#panel.min .btns{margin-top:2px}
#saved{width:100%;max-width:340px}
#saved .btns button{min-width:0}

<script>
/*PARSER_START*/
const D2R=Math.PI/180;
function hsv(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return (Math.round((r+m)*255)<<16)|(Math.round((g+m)*255)<<8)|Math.round((b+m)*255);}
function aciRGB(n){
  const base={1:0xff0000,2:0xffff00,3:0x00ff00,4:0x00ffff,5:0x0000ff,6:0xff00ff,7:0xffffff,8:0x808080,9:0xc0c0c0};
  if(base[n]!==undefined)return base[n];
  if(n>=250&&n<=255){const v=[51,91,132,173,214,255][n-250];return (v<<16)|(v<<8)|v}
  if(n>=10&&n<=249){const hue=Math.floor((n-10)/10)*15,k=(n-10)%10;return hsv(hue,(k%2)?0.5:1,[1,0.65,0.5,0.3,0.15][k>>1])}
  return 0xffffff;}
function mul(A,B){return [A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];}
function tr(M,x,y){return [M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]];}
function cleanT(s){return s.replace(/\\U\+([0-9A-Fa-f]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/%%[cC]/g,'Ø').replace(/%%[dD]/g,'°').replace(/%%[pP]/g,'±').replace(/%%[uUoO]/g,'');}
function cleanMT(s){return cleanT(s).replace(/\\P/g,'\n').replace(/\\S([^;^\/#]*)[\^\/#]([^;]*);/g,'$1/$2').replace(/\\[Ff][^;]*;/g,'').replace(/\\[HhWwQqTtAaCc][^;]*;/g,'').replace(/\\[LlOoKk]/g,'').replace(/\\~/g,' ').replace(/\\\\/g,'\\').replace(/[{}]/g,'');}
function bulgePts(x1,y1,x2,y2,b){
  const d=Math.hypot(x2-x1,y2-y1);if(d<1e-12||Math.abs(b)<1e-12)return [];
  const a=(d/2)*(1-b*b)/(2*b),nx=-(y2-y1)/d,ny=(x2-x1)/d,cx=(x1+x2)/2+nx*a,cy=(y1+y2)/2+ny*a;
  const r=Math.hypot(x1-cx,y1-cy),a0=Math.atan2(y1-cy,x1-cx),sw=4*Math.atan(b);
  const n=Math.max(2,Math.ceil(Math.abs(sw)/(Math.PI/48)));const o=[];
  for(let i=1;i<n;i++){const t=a0+sw*i/n;o.push(cx+r*Math.cos(t),cy+r*Math.sin(t))}return o;}
function deBoor(deg,knots,ctrl){
  const n=ctrl.length,out=[];
  if(knots.length!==n+deg+1||n<deg+1)return ctrl.map(c=>c.slice());
  const t0=knots[deg],t1=knots[n],N=Math.max(24,Math.min(3000,n*14));
  for(let i=0;i<=N;i++){
    let t=t0+(t1-t0)*i/N;if(i===N)t=t1-1e-9*(t1-t0||1);
    let k=deg;while(k<n-1&&knots[k+1]<=t)k++;
    const d=[];for(let j=0;j<=deg;j++)d.push(ctrl[k-deg+j].slice());
    for(let r=1;r<=deg;r++)for(let j=deg;j>=r;j--){
      const den=knots[j+1+k-r]-knots[j+k-deg],al=den===0?0:(t-knots[j+k-deg])/den;
      for(let q=0;q<3;q++)d[j][q]=(1-al)*d[j-1][q]+al*d[j][q];}
    out.push(d[deg]);}
  return out;}

function parseDXF(text){
  const Ls=text.split(/\r\n|\r|\n/);
  const codes=[],vals=[];
  for(let i=0;i+1<Ls.length;){
    if(!/^\s*-?\d+\s*$/.test(Ls[i])){i++;continue}
    codes.push(parseInt(Ls[i],10));vals.push(Ls[i+1]);i+=2;}
  const N=codes.length;
  const items={TABLES:[],BLOCKS:[],ENTITIES:[]};let curSec=null,units=0,i=0;
  while(i<N){
    if(codes[i]===0){
      const t=vals[i].trim();
      if(t==='SECTION'){curSec=(i+1<N&&codes[i+1]===2)?vals[i+1].trim():null;i+=2;continue}
      if(t==='ENDSEC'){curSec=null;i++;continue}
      if(t==='EOF')break;
      let j=i+1;while(j<N&&codes[j]!==0)j++;
      if(curSec&&items[curSec])items[curSec].push({t,s:i+1,e:j});
      i=j;continue;}
    if(curSec==='HEADER'&&codes[i]===9&&vals[i].trim()==='$INSUNITS'&&i+1<N)units=parseInt(vals[i+1])||0;
    i++;}
  const gs=(it,c)=>{for(let k=it.s;k<it.e;k++)if(codes[k]===c)return vals[k];return undefined};
  const gf=(it,c,d)=>{const v=gs(it,c);if(v===undefined)return d;const x=parseFloat(v);return isNaN(x)?d:x};
  const layers={};
  const getLayer=n=>layers[n]||(layers[n]={name:n,color:0xffffff,on:true,count:0});
  for(const it of items.TABLES){if(it.t!=='LAYER')continue;
    const L=getLayer((gs(it,2)||'0').trim()),aci=gf(it,62,7),fl=gf(it,70,0),tc=gs(it,420);
    L.color=tc!==undefined?(parseInt(tc)&0xffffff):aciRGB(Math.abs(aci));
    L.on=aci>=0&&!(fl&1);L.lw=gf(it,370,-3);}
  const blocks={};let cb=null;
  for(const it of items.BLOCKS){
    if(it.t==='BLOCK'){cb={name:(gs(it,2)||'').trim(),bx:gf(it,10,0),by:gf(it,20,0),items:[]};blocks[cb.name]=cb}
    else if(it.t==='ENDBLK')cb=null;else if(cb)cb.items.push(it);}
  const prims=[],texts=[],sx=[],sy=[],sz=[],st=[],sl=[],so=[],skipped={},counts={};
  const SILENT={SEQEND:1,VERTEX:1,ATTDEF:1,VIEWPORT:1,XLINE:1,RAY:1,IMAGE:1,MLINE:1,MLEADER:1,WIPEOUT:1,OLE2FRAME:1};
  function style(it,ctx){
    let ln=gs(it,8);ln=ln===undefined?'0':ln.trim();if(ln==='0'&&ctx.layer)ln=ctx.layer;
    const L=getLayer(ln),tc=gs(it,420),aci=gf(it,62,256);let col;
    if(tc!==undefined)col=parseInt(tc)&0xffffff;else if(aci===256)col=L.color;else if(aci===0)col=ctx.color;else col=aciRGB(Math.abs(aci));
    const le=gf(it,370,-1);return {L,col,lw:le>=0?le:(L.lw>=0?L.lw:25)};}
  function addSnap(sty,x,y,z,t,own){sx.push(x);sy.push(y);sz.push(z);st.push(t);sl.push(sty.L);so.push(own||null)}
  function EXI(ctx,M,t,c,z,r,a0,a1){return (M===ctx.M&&ctx.M[0]===1&&ctx.M[1]===0&&ctx.M[2]===0&&ctx.M[3]===1)?{t,c:[c[0],c[1],z],r,a0,a1}:undefined}
  function addPoly(flat,closed,sty,type,snaps,extra){
    let x0=1e300,y0=1e300,x1=-1e300,y1=-1e300;
    for(let i=0;i<flat.length;i+=2){const x=flat[i],y=flat[i+1];if(!(isFinite(x)&&isFinite(y)))return;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    const info=extra||{};info.type=type;
    const pr={pts:flat,closed,L:sty.L,col:sty.col,lc:(sty.lw>60?3:sty.lw>35?2:sty.lw>18?1:0),bb:[x0,y0,x1,y1],info};prims.push(pr);sty.L.count++;counts[type]=(counts[type]||0)+1;
    if(snaps)for(const q of snaps)addSnap(sty,q[0],q[1],q[2],q[3],pr);}
  function ocs(it,M){
    const ex=gf(it,210,0),ey=gf(it,220,0),ez=gf(it,230,1);if(ex===0&&ey===0&&ez>0)return M;

async function loadSaved(name){

  for(const [n,on] of rec.layers){const L=DB.layers.find(x=>x.name===n);if(L)L.on=on}
  for(const u of rec.user){const p=addUserPrim(u.f,u.c,u.t,u.i,u.sn);p._sn=u.sn}
  for(const r of rec.anns){const a=Object.assign({isAnn:1,objs:[]},r);DB.anns.push(a);matAnn(a)}
  GID=Math.max(GID,rec.GID||0);if(rec.view){Object.assign(view,rec.view)}
  hist=[];updUndo();renderPanel();req()}

let expPx=2400,expBg='white';
function renderRegion(r,pxLong,white){
  const w=r.x1-r.x0,h=r.y1-r.y0,s=pxLong/Math.max(w,h);let cw=Math.max(2,Math.round(w*s)),ch=Math.max(2,Math.round(h*s));
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const cx=c.getContext('2d');
  const sg=g,ssel=sel,sd=S.dark,sm=S.minTxt;g=cx;S.dark=!white;sel=null;S.minTxt=sm*s/view.s;
  try{g.setTransform(1,0,0,1,0,0);drawScene({cx:(r.x0+r.x1)/2,cy:(r.y0+r.y1)/2,s},cw,ch)}finally{g=sg;sel=ssel;S.dark=sd;S.minTxt=sm}
  return c}
function makePDF(jpg,w,h){
  const land=w>h,PW=land?842:595,PH=land?595:842,m=24,k=Math.min((PW-2*m)/w,(PH-2*m)/h),iw=w*k,ih=h*k,ix=(PW-iw)/2,iy=(PH-ih)/2;
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;add(n+' 0 obj\n'+body+'\nendobj\n')};
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=len;add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream\nendobj\n');
  const cs=`q ${iw.toFixed(2)} 0 0 ${ih.toFixed(2)} ${ix.toFixed(2)} ${iy.toFixed(2)} cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'})}
async function saveBlob(name,blob){
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function extentsRect(){let x0=1e300,y0=1e300,x1=-1e300,y1=-1e300;
  for(const p of DB.prims){if(!p.L.on||p.del)continue;const b=p.bb;x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])}
  for(const t of DB.texts){if(!t.L.on||t.del)continue;x0=Math.min(x0,t.x);y0=Math.min(y0,t.y);x1=Math.max(x1,t.x);y1=Math.max(y1,t.y)}
  if(x0>x1)return null;const pad=Math.max(x1-x0,y1-y0,1e-6)*0.02;return {x0:x0-pad,y0:y0-pad,x1:x1+pad,y1:y1+pad}}
async function doExport(kind){
  if(!expRect)return;flash('در حال ساختن خروجی…');await new Promise(r=>setTimeout(r,30));
  let px=expPx;const asp=(expRect.x1-expRect.x0)/(expRect.y1-expRect.y0);if(px*px/Math.max(asp,1/asp)>1.2e7)px=Math.floor(Math.sqrt(1.2e7*Math.max(asp,1/asp)));
  const c=renderRegion(expRect,px,expBg==='white'),base=(fileName||'map').replace(/\.[^.]+$/,'');

function showNews(){let last=null;try{last=localStorage.getItem('mv_ver');localStorage.setItem('mv_ver',APP_VER);if(!last&&localStorage.getItem('mv_cfg'))last='1.2.0'}catch(_){}
  if(last&&last!==APP_VER)openSheet(`<h3>🎉 نسخه‌ی ${APP_VER} نصب شد</h3><div style="line-height:2"><ul style="margin:0;padding-right:18px">${NEWS.map(x=>'<li>'+x+'</li>').join('')}</ul></div><div class="btns"><button class="pri" onclick="document.getElementById('sheet').style.display='none'">باشه</button></div>`)}
function initSW(){
  const had=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloading)return;reloading=true;
    if(DB&&DB.srcText){try{localStorage.setItem('mv_resume',fileName)}catch(_){}saveProject(false).catch(()=>{}).then(()=>location.reload())}else location.reload()});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>flash('نسخه‌ی تازه پیدا شد؛ در حال به‌روزرسانی…'));
    const chk=()=>reg.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setInterval(chk,1800000)}).catch(()=>{})})}

buildTools();syncChips();loadFonts();$('ver').textContent='v'+APP_VER;
(async()=>{try{const k=localStorage.getItem('mv_resume');if(k){localStorage.removeItem('mv_resume');await loadSaved(k)}}catch(_){}refreshSaved();showNews()})();

/* ---- file ---- */
function setDB(d,name){d.anns=[];DB=d;fileName=name;tool='pan';pts=[];tent=null;log=[];sel=null;hover=null;hist=[];updUndo();
  d.mk=d.layers.find(l=>l.name==='MARKUP')||{name:'MARKUP',color:0xffa500,on:true,count:0};if(!d.layers.includes(d.mk))d.layers.push(d.mk);
  selSet=[];dimArc=null;box=null;setTool('pan');
  $('fname').textContent=name;$('empty').style.display='none';renderPanel();resize();zoomExtents();
  const sk=Object.entries(d.skipped);
  if(!d.prims.length&&!d.texts.length)msg('خالی','موجودیت قابل نمایشی پیدا نشد.'+(sk.length?'<br>نوع‌های پشتیبانی‌نشده: <span dir="ltr">'+sk.map(([k,v])=>k+'×'+v).join(', ')+'</span>':''));
  else if(sk.length)flash('بعضی موجودیت‌ها نمایش داده نشد: '+sk.map(([k])=>k).join(', '))}
function openBuffer(buf,name){
  const u8=new Uint8Array(buf),head=String.fromCharCode.apply(null,u8.subarray(0,22));
  if(head.startsWith('AutoCAD Binary DXF'))return msg('DXF باینری','این DXF از نوع باینری است. هنگام ذخیره/تبدیل، گزینه‌ی <b>ASCII DXF</b> را انتخاب کنید.');
  if(/^AC10\d\d/.test(head))return msg('فایل DWG است','مرورگر نمی‌تواند DWG را مستقیم باز کند. فایل را با <b>ODA File Converter</b> (رایگان، روی کامپیوتر) یا هر مبدل دیگر به <b>ASCII DXF</b> (ترجیحاً نسخه‌ی R2000 یا 2004) تبدیل کنید و همان را اینجا باز کنید.');
  let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(u8)}catch(_){try{text=new TextDecoder('windows-1256').decode(u8)}catch(__){text=new TextDecoder('utf-8').decode(u8)}}
  if(!/^\s*0\s*\n\s*SECTION/m.test(text.slice(0,2000)))return msg('فرمت نامعتبر','این فایل شبیه DXF متنی نیست.');
  const D=parseDXF(text);D.srcText=text;setDB(D,name);}
function loadFile(file){
  flash('در حال بارگذاری…');const fr=new FileReader();
  fr.onload=()=>setTimeout(()=>{try{openBuffer(fr.result,file.name)}catch(err){msg('خطا در خواندن فایل',String(err&&err.message||err))}},30);
  fr.onerror=()=>msg('خطا','فایل خوانده نشد.');fr.readAsArrayBuffer(file)}
$('file').addEventListener('change',e=>{const fl=e.target.files[0];if(fl)loadFile(fl);e.target.value=''});
$('bOpen').onclick=$('bOpen2').onclick=()=>$('file').click();
$('bDemo').onclick=()=>{
  const P=[[0,'SECTION'],[2,'ENTITIES'],[0,'LINE'],[8,'محور'],[62,1],[10,0],[20,0],[11,100],[21,0],
  [0,'LWPOLYLINE'],[8,'ساختمان'],[62,3],[90,4],[70,1],[10,10],[20,10],[10,60],[20,10],[10,60],[20,50],[10,10],[20,50],
  [0,'CIRCLE'],[8,'درخت'],[62,5],[10,80],[20,30],[40,15],
  [0,'ARC'],[8,'محور'],[62,2],[10,30],[20,70],[40,20],[50,0],[51,180],
  [0,'POINT'],[8,'نقاط'],[62,6],[10,95],[20,60],[30,12.5],
  [0,'TEXT'],[8,'متن'],[62,7],[10,12],[20,54],[40,4],[1,'Building A'],
  [0,'ENDSEC'],[0,'EOF']];
  const tx=P.map(p=>p.join('\n')).join('\n');const D=parseDXF(tx);D.srcText=tx;setDB(D,'نمونه.dxf')};
resize();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))initSW();
</script>
