<title>نمایشگر نقشه</title>
<style>
:root{color-scheme:dark;--bg:#14171c;--bar:#1e232b;--line:#313a47;--tx:#e8ecf2;--mut:#93a0b3;--acc:#3ea6ff;--ok:#33c27f;--warn:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,Vazirmatn,Tahoma,sans-serif;overscroll-behavior:none;font-size:14px}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{background:#2a313c}
button.pri{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
button:disabled{opacity:.4}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:6px;background:var(--bar);border-bottom:1px solid var(--line)}
#fname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:12px;direction:ltr;text-align:center}
#wrap{flex:1;position:relative;min-height:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;top:0;left:0;touch-action:none;display:block}
#fab{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#fab button{width:42px;height:42px;padding:0;font-size:20px;background:rgba(30,35,43,.92)}
#empty{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--mut);line-height:1.9}
#empty b{color:var(--tx);font-size:18px}
#empty button{font-size:16px;padding:12px 22px}
#panel{background:var(--bar);border-top:1px solid var(--line);padding:8px 10px;max-height:44vh;overflow:auto;display:none}
.r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #28303b}
.r span{color:var(--mut)}
.r b{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;font-size:15px}
.r.big b{color:var(--warn);font-size:17px}
.hint,.sn{color:var(--mut);font-size:12.5px;padding:4px 0}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:84px;padding:9px 6px}
#tools{display:flex;overflow-x:auto;background:var(--bar);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools .sep{flex:0 0 1px;background:var(--line);margin:6px 2px}
#tools button{flex:1 0 auto;min-width:62px;border:0;border-radius:0;background:transparent;padding:8px 6px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
#tools button i{font-style:normal;font-size:19px;line-height:1.1}
#tools button.on{color:var(--acc);background:#232b36}
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet .box{background:var(--bar);width:100%;max-width:560px;max-height:78vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;border:1px solid var(--line)}
#sheet h3{margin:0 0 10px;font-size:16px}
.lr{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #28303b}
.lr .sw{width:16px;height:16px;border-radius:4px;border:1px solid #555;flex:none}
.lr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right;white-space:nowrap}
.lr .ct{color:var(--mut);font-size:12px}
.lr input[type=checkbox]{width:20px;height:20px}
select{font:inherit;background:#12161b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px}
input[type=text],input[type=number]{font:inherit;font-size:16px;background:#12161b;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;direction:rtl}
.fl{display:flex;gap:8px;align-items:center;margin-top:8px}.fl label{color:var(--mut);white-space:nowrap}
#brand{width:96px;height:96px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.ver{color:var(--mut);font-size:12px;line-height:1.9;padding-top:8px}
#chips{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#chips button{padding:5px 11px;font-size:12px;border-radius:16px;background:rgba(30,35,43,.92)}
#chips button.on{background:var(--ok);color:#04210f;border-color:var(--ok);font-weight:700}
#sub{display:none;overflow-x:auto;background:#232b36;border-top:1px solid var(--line);scrollbar-width:none}
#sub::-webkit-scrollbar{display:none}
#sub button{flex:1 0 auto;min-width:78px;border:0;border-radius:0;background:transparent;padding:9px 8px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
#sub button i{font-style:normal;font-size:19px;line-height:1.1}
#sub button.on{color:var(--acc);background:#2c3644}
#tools button.open{background:#232b36}
#tools sup{font-size:9px;margin-right:2px;vertical-align:top}
#top{position:relative}
#ver{position:absolute;left:5px;top:max(1px,env(safe-area-inset-top));font-size:9px;color:var(--mut);opacity:.75;pointer-events:none;direction:ltr}
.grab{height:16px;margin:-6px 0 2px;position:relative;touch-action:none;cursor:pointer}
.grab::after{content:'';position:absolute;left:50%;top:6px;width:46px;height:4px;margin-left:-23px;border-radius:3px;background:#56627a}
#panel.min>*:not(.btns):not(.grab):not(.keep){display:none}
#panel.min .btns{margin-top:2px}
#saved{width:100%;max-width:340px}
#saved .btns button{min-width:0}

<script>
/*PARSER_START*/
const D2R=Math.PI/180;
function hsv(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return (Math.round((r+m)*255)<<16)|(Math.round((g+m)*255)<<8)|Math.round((b+m)*255);}
function aciRGB(n){
  const base={1:0xff0000,2:0xffff00,3:0x00ff00,4:0x00ffff,5:0x0000ff,6:0xff00ff,7:0xffffff,8:0x808080,9:0xc0c0c0};
  if(base[n]!==undefined)return base[n];
  if(n>=250&&n<=255){const v=[51,91,132,173,214,255][n-250];return (v<<16)|(v<<8)|v}
  if(n>=10&&n<=249){const hue=Math.floor((n-10)/10)*15,k=(n-10)%10;return hsv(hue,(k%2)?0.5:1,[1,0.65,0.5,0.3,0.15][k>>1])}
  return 0xffffff;}
function mul(A,B){return [A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];}
function tr(M,x,y){return [M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]];}
function cleanT(s){return s.replace(/\\U\+([0-9A-Fa-f]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/%%[cC]/g,'Ø').replace(/%%[dD]/g,'°').replace(/%%[pP]/g,'±').replace(/%%[uUoO]/g,'');}
function cleanMT(s){return cleanT(s).replace(/\\P/g,'\n').replace(/\\S([^;^\/#]*)[\^\/#]([^;]*);/g,'$1/$2').replace(/\\[Ff][^;]*;/g,'').replace(/\\[HhWwQqTtAaCc][^;]*;/g,'').replace(/\\[LlOoKk]/g,'').replace(/\\~/g,' ').replace(/\\\\/g,'\\').replace(/[{}]/g,'');}
function bulgePts(x1,y1,x2,y2,b){
  const d=Math.hypot(x2-x1,y2-y1);if(d<1e-12||Math.abs(b)<1e-12)return [];
  const a=(d/2)*(1-b*b)/(2*b),nx=-(y2-y1)/d,ny=(x2-x1)/d,cx=(x1+x2)/2+nx*a,cy=(y1+y2)/2+ny*a;
  const r=Math.hypot(x1-cx,y1-cy),a0=Math.atan2(y1-cy,x1-cx),sw=4*Math.atan(b);
  const n=Math.max(2,Math.ceil(Math.abs(sw)/(Math.PI/48)));const o=[];
  for(let i=1;i<n;i++){const t=a0+sw*i/n;o.push(cx+r*Math.cos(t),cy+r*Math.sin(t))}return o;}
function deBoor(deg,knots,ctrl){
  const n=ctrl.length,out=[];
  if(knots.length!==n+deg+1||n<deg+1)return ctrl.map(c=>c.slice());
  const t0=knots[deg],t1=knots[n],N=Math.max(24,Math.min(3000,n*14));
  for(let i=0;i<=N;i++){
    let t=t0+(t1-t0)*i/N;if(i===N)t=t1-1e-9*(t1-t0||1);
    let k=deg;while(k<n-1&&knots[k+1]<=t)k++;
    const d=[];for(let j=0;j<=deg;j++)d.push(ctrl[k-deg+j].slice());
    for(let r=1;r<=deg;r++)for(let j=deg;j>=r;j--){
      const den=knots[j+1+k-r]-knots[j+k-deg],al=den===0?0:(t-knots[j+k-deg])/den;
      for(let q=0;q<3;q++)d[j][q]=(1-al)*d[j-1][q]+al*d[j][q];}
    out.push(d[deg]);}
  return out;}

function parseDXF(text){

function acin(rgb){rgb&=0xffffff;let v=ACI_CACHE.get(rgb);if(v)return v;
  const r=(rgb>>16)&255,gg=(rgb>>8)&255,b=rgb&255;let best=7,bd=1e18;
  for(let n=1;n<=255;n++){const c=aciRGB(n),dr=((c>>16)&255)-r,dg=((c>>8)&255)-gg,db=(c&255)-b,d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=n}}

function buildDXF(only){

  const lname=L=>enc((String(L.name).replace(/[<>\/\\":;?*|=`,]/g,'_')||'0')).slice(0,250);
  const useL=L=>{const n=lname(L);if(!lay.has(n))lay.set(n,acin(L.color));return n};

    else if(X&&X.t==='C'){hd('CIRCLE');w(10,num(X.c[0]));w(20,num(X.c[1]));w(30,num(X.c[2]));w(40,num(X.r))}
    else if(X&&X.t==='A'){hd('ARC');w(10,num(X.c[0]));w(20,num(X.c[1]));w(30,num(X.c[2]));w(40,num(X.r));w(50,num(X.a0));w(51,num(X.a1))}

function segHitsRect(ax,ay,bx,by,x0,y0,x1,y1){
  let t0=0,t1=1;const dx=bx-ax,dy=by-ay,p=[-dx,dx,-dy,dy],q=[ax-x0,x1-ax,ay-y0,y1-ay];
  for(let i=0;i<4;i++){if(p[i]===0){if(q[i]<0)return false}else{const r=q[i]/p[i];if(p[i]<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}}
  return true}
function boxPick(xa,ya,xb,yb,cross){
  const x0=Math.min(xa,xb),x1=Math.max(xa,xb),y0=Math.min(ya,yb),y1=Math.max(ya,yb),out=[];
  for(const p of DB.prims){if(!p.L.on||p.del)continue;const b=p.bb;
    if(b[2]<x0||b[0]>x1||b[3]<y0||b[1]>y1)continue;
    if(!cross){if(b[0]>=x0&&b[2]<=x1&&b[1]>=y0&&b[3]<=y1)out.push(p);continue}
    const P=p.pts,n=P.length;let hit=n===2;
    for(let i=0;i<n&&!hit;i+=2)if(P[i]>=x0&&P[i]<=x1&&P[i+1]>=y0&&P[i+1]<=y1)hit=true;

function paintGeo(geo,col){
  g.save();g.strokeStyle=col;g.lineWidth=1.5;
  for(const q of geo.polys){const F=q.f;if(F.length<4){const [a,b]=w2s(F[0],F[1]);g.beginPath();g.arc(a,b,3,0,7);g.stroke();continue}
    g.beginPath();let [a,b]=w2s(F[0],F[1]);g.moveTo(a,b);for(let i=2;i<F.length;i+=2){[a,b]=w2s(F[i],F[i+1]);g.lineTo(a,b)}if(q.closed)g.closePath();g.stroke()}
  for(const T of (geo.txts||[])){const [a,b]=w2s(T.x,T.y);paintText({s:T.s,h:T.h,rot:T.rot,ah:T.ah,av:T.av,f:T.f,xs:T.xs,mine:true},view.s,a,b,col)}
  g.restore()}
function quickLabel(p,tag){
  const [a,b]=w2s(p.x,p.y),ls=[(tag?tag+'  ':'')+'X '+f(p.x),'Y '+f(p.y),'Z '+f(p.z)];
  g.save();g.font='12px ui-monospace,Menlo,monospace';g.textBaseline='alphabetic';g.textAlign='left';
  const w=Math.max(...ls.map(s=>g.measureText(s).width))+10,hh=ls.length*15+6;let bx=a+12,by=b-hh-8;
  if(bx+w>W)bx=a-12-w;if(by<2)by=b+10;
  g.fillStyle='rgba(10,12,16,.85)';g.fillRect(bx,by,w,hh);g.strokeStyle='#33c27f';g.lineWidth=1;g.strokeRect(bx,by,w,hh);
  g.fillStyle='#e8ecf2';ls.forEach((s,k)=>g.fillText(s,bx+5,by+15+k*15));g.restore()}
function overlayExtra(live,pts,tent){
  cxOverlay(live,pts,tent);

  if(tool==='sel'||tool==='mov'||tool==='cpy'){
    if(selSet.length){g.save();g.strokeStyle='#ffd23f';g.lineWidth=2;g.setLineDash([6,4]);g.beginPath();
      for(const o of selSet){if(o.del)continue;
        if(o.s!==undefined){const [a,b]=w2s(o.x,o.y);g.rect(a-6,b-6,12,12);continue}
        const P=o.pts;if(P.length===2){const [a,b]=w2s(P[0],P[1]);g.moveTo(a+7,b);g.arc(a,b,7,0,7);continue}
        let [a,b]=w2s(P[0],P[1]);g.moveTo(a,b);for(let i=2;i<P.length;i+=2){[a,b]=w2s(P[i],P[i+1]);g.lineTo(a,b)}if(o.closed)g.closePath()}
      g.stroke();g.setLineDash([]);
      const seen=new Set();for(const o of selSet){const A=o.ann;if(A&&A.kind==='coord'&&A.tp&&!seen.has(A)){seen.add(A);const [a,b]=w2s(A.tp.x,A.tp.y);g.beginPath();g.arc(a,b,12,0,7);g.fillStyle='rgba(255,210,63,.25)';g.fill();g.stroke()}}
      g.restore()}
    if(dragT&&dragT.k==='ann'){const gg=annGeo(dragT.a);if(gg)paintGeo(gg,'#ffd23f')}
    if(box){const x=Math.min(box.x0,box.x1),y=Math.min(box.y0,box.y1),w=Math.abs(box.x1-box.x0),hh=Math.abs(box.y1-box.y0),cr=box.x1<box.x0;
      g.save();g.fillStyle=cr?'rgba(51,194,127,.18)':'rgba(62,166,255,.18)';g.strokeStyle=cr?'#33c27f':'#3ea6ff';g.lineWidth=1.5;if(cr)g.setLineDash([7,5]);
      g.fillRect(x,y,w,hh);g.strokeRect(x,y,w,hh);g.restore()}}
  if(tool==='exp'){
    if(expRect){const [a,b]=w2s(expRect.x0,expRect.y1),[c,d]=w2s(expRect.x1,expRect.y0);g.save();g.strokeStyle='#3ea6ff';g.lineWidth=2;g.setLineDash([8,5]);g.fillStyle='rgba(62,166,255,.10)';g.fillRect(a,b,c-a,d-b);g.strokeRect(a,b,c-a,d-b);g.restore()}
    if(box){const x=Math.min(box.x0,box.x1),y=Math.min(box.y0,box.y1);g.save();g.strokeStyle='#3ea6ff';g.lineWidth=2;g.setLineDash([8,5]);g.strokeRect(x,y,Math.abs(box.x1-box.x0),Math.abs(box.y1-box.y0));g.restore()}}
  if(DIMT[tool]){
    const d=dsCur(),col=css(d.col),geo=dimGeom(tool,live,dimArc,d,autoH(),tool==='dli'?S.dlm:S.dom);
    if(geo){const ts=tsById(d.ts),T=geo.txt||geo.prevTxt;const gg={polys:geo.polys,txts:T?[Object.assign({h:geo.h,f:ts.font,xs:ts.xs},T)]:[]};paintGeo(gg,col)}
    g.font='bold 12px sans-serif';g.textAlign='left';
    pts.forEach((p,i)=>{const [a,b]=w2s(p.x,p.y);g.fillStyle='#ffd23f';g.beginPath();g.arc(a,b,4,0,7);g.fill();g.fillText(String(i+1),a+7,b-7)})}

  const rec=projRec();await idb.put('p:'+rec.name,rec);await idb.put('m:'+rec.name,{name:rec.name,t:rec.t,kb:Math.round(rec.text.length/1024)});
  isDirty=false;setDirtyUI();if(manual)flash('ذخیره شد');refreshSaved()}
async function saveResume(){if(!DB||!DB.srcText)return false;const rec=projRec();await idb.put('r:'+rec.name,rec);try{localStorage.setItem('mv_resume',rec.name)}catch(_){}return true}
async function loadSaved(name,key){
  const rec=await idb.get((key||'p:')+name);if(!rec){flash('فایل ذخیره‌شده پیدا نشد');return}
  const D=parseDXF(rec.text);D.srcText=rec.text;setDB(D,rec.name);
  for(const i of rec.delP)if(DB.prims[i])DB.prims[i].del=true;for(const i of rec.delT)if(DB.texts[i])DB.texts[i].del=true;
  for(const [n,on] of rec.layers){const L=DB.layers.find(x=>x.name===n);if(L)L.on=on}
  for(const u of rec.user){const Ly=u.ln?DB.layers.find(x=>x.name===u.ln):null;const p=addUserPrim(u.f,u.c,u.t,u.i,u.sn,u.col,u.lc,Ly||undefined);p._sn=u.sn}
  for(const r of rec.anns){const a=Object.assign({isAnn:1,objs:[]},r);DB.anns.push(a);matAnn(a)}
  GID=Math.max(GID,rec.GID||0);if(rec.view){Object.assign(view,rec.view)}
  hist=[];updUndo();renderPanel();req()}
async function refreshSaved(){
  const B=$('saved');if(!B)return;let ms=[];try{ms=await idb.metas()}catch(_){}

    if(b.dataset.ld!==undefined){try{await loadSaved(ms[+b.dataset.ld].name)}catch(err){msg('خطا',String(err&&err.message||err))}}

let expPx=2400,expBg='white';
function renderRegion(r,pxLong,white){
  const w=r.x1-r.x0,h=r.y1-r.y0,s=pxLong/Math.max(w,h);let cw=Math.max(2,Math.round(w*s)),ch=Math.max(2,Math.round(h*s));
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const cx=c.getContext('2d');
  const sg=g,ssel=sel,sd=S.dark,sm=S.minTxt;g=cx;S.dark=!white;sel=null;S.minTxt=sm*s/view.s;
  try{g.setTransform(1,0,0,1,0,0);drawScene({cx:(r.x0+r.x1)/2,cy:(r.y0+r.y1)/2,s},cw,ch)}finally{g=sg;sel=ssel;S.dark=sd;S.minTxt=sm}
  return c}
function makePDF(jpg,w,h){
  const land=w>h,PW=land?842:595,PH=land?595:842,m=24,k=Math.min((PW-2*m)/w,(PH-2*m)/h),iw=w*k,ih=h*k,ix=(PW-iw)/2,iy=(PH-ih)/2;
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;add(n+' 0 obj\n'+body+'\nendobj\n')};
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=len;add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream\nendobj\n');
  const cs=`q ${iw.toFixed(2)} 0 0 ${ih.toFixed(2)} ${ix.toFixed(2)} ${iy.toFixed(2)} cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'})}
async function saveBlob(name,blob){
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function extentsRect(){let x0=1e300,y0=1e300,x1=-1e300,y1=-1e300;

  for(const t of DB.texts){if(!t.L.on||t.del)continue;x0=Math.min(x0,t.x);y0=Math.min(y0,t.y);x1=Math.max(x1,t.x);y1=Math.max(y1,t.y)}
  if(x0>x1)return null;const pad=Math.max(x1-x0,y1-y0,1e-6)*0.02;return {x0:x0-pad,y0:y0-pad,x1:x1+pad,y1:y1+pad}}

const EDT={era:'پاک‌کن',trm:'تریم',ext:'اکستند',brk:'بریک',fil:'فیلت',chm:'چمفر',off:'آفست',xpl:'منفجر'};

function edReset(){ed={step:0}}

/* ---- هندسه ---- */
function segX(ax,ay,bx,by,cx,cy,dx,dy){
  const r1=bx-ax,r2=by-ay,s1=dx-cx,s2=dy-cy,den=r1*s2-r2*s1;
  if(Math.abs(den)<1e-13*(Math.hypot(r1,r2)*Math.hypot(s1,s2)+1e-300))return null;
  const qx=cx-ax,qy=cy-ay;return [(qx*s2-qy*s1)/den,(qx*r2-qy*r1)/den]}
function pathOf(p){const P=p.pts,V=[];for(let i=0;i<P.length;i+=2)V.push([P[i],P[i+1]]);if(p.closed&&V.length>2)V.push([P[0],P[1]]);return V}
function pathZ(p){const I=p.info,n=p.pts.length/2,z=[];for(let i=0;i<n;i++)z.push(I.zs?(I.zs[i]||0):I.z?(I.z[i]||0):(I.c?(I.c[2]||0):0));if(p.closed&&n>2)z.push(z[0]);return z}
function nearU(V,wx,wy){let best=1e300,bu=0;
  for(let i=0;i<V.length-1;i++){const [ax,ay]=V[i],[bx,by]=V[i+1],dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?((wx-ax)*dx+(wy-ay)*dy)/L:0;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(ax+t*dx-wx,ay+t*dy-wy);if(d<best){best=d;bu=i+t}}
  return bu}
function boundSegs(excl,bb){
  const out=[],[x0,y0,x1,y1]=bb;
  for(const q of DB.prims){if(q===excl||q.del||!q.L.on)continue;const b=q.bb;if(b[2]<x0||b[0]>x1||b[3]<y0||b[1]>y1)continue;
    const P=q.pts,n=P.length;if(n<4)continue;const m=q.closed?n:n-2;
    for(let i=0;i<m;i+=2){const j=(i+2)%n;out.push([P[i],P[i+1],P[j],P[j+1]])}}
  return out}
function ptAt(V,Z,u,closed){const m=V.length-1;let i=Math.floor(u+1e-12);if(!closed&&i>=m)i=m-1;if(i<0)i=0;const t=u-i,a=V[i%m],b=V[(i%m)+1];
  const za=Z[i%m],zb=Z[(i%m)+1];return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,za+(zb-za)*t]}
function subPath(V,Z,ua,ub,closed){
  const m=V.length-1,out=[ptAt(V,Z,ua,closed)];
  for(let k=Math.floor(ua+1e-9)+1;k<ub-1e-9;k++){const i=k%m;out.push([V[i][0],V[i][1],Z[i]])}
  out.push(ptAt(V,Z,ub,closed));return out}

/* ---- ساخت شیء با ویژگی‌های شیء قبلی ---- */
function mkLike(like,flat,closed,type,info,snaps){return addUserPrim(flat,closed,type,info,snaps,like.col,like.lc,like.L)}
function mkLine(like,a,b){const za=a[2]||0,zb=b[2]||0;
  return mkLike(like,[a[0],a[1],b[0],b[1]],false,'LINE',{z:[za,zb]},[[a[0],a[1],za,'e'],[b[0],b[1],zb,'e'],[(a[0]+b[0])/2,(a[1]+b[1])/2,(za+zb)/2,'m']])}
function mkArc(like,cx,cy,r,a0,sw,z){
  const n=Math.max(8,Math.ceil(Math.abs(sw)/(Math.PI/90))),flat=[];
  for(let q=0;q<=n;q++){const t=a0+sw*q/n;flat.push(cx+r*Math.cos(t),cy+r*Math.sin(t))}
  const mi=Math.floor(n/2)*2,dd=x=>((x*180/Math.PI)%360+360)%360,s0=sw>=0?a0:a0+sw,s1=sw>=0?a0+sw:a0;
  return mkLike(like,flat,false,'ARC',{r,sw,len:r*Math.abs(sw),c:[cx,cy,z],ex:{t:'A',c:[cx,cy,z],r,a0:dd(s0),a1:dd(s1)}},
    [[cx,cy,z,'c'],[flat[0],flat[1],z,'e'],[flat[flat.length-2],flat[flat.length-1],z,'e'],[flat[mi],flat[mi+1],z,'m']])}
function mkCircle(like,cx,cy,r,z){
  const n=120,flat=[];for(let q=0;q<n;q++){const t=2*Math.PI*q/n;flat.push(cx+r*Math.cos(t),cy+r*Math.sin(t))}
  return mkLike(like,flat,true,'CIRCLE',{r,area:Math.PI*r*r,len:2*Math.PI*r,c:[cx,cy,z],ex:{t:'C',c:[cx,cy,z],r}},
    [[cx,cy,z,'c'],[cx+r,cy,z,'e'],[cx-r,cy,z,'e'],[cx,cy+r,z,'e'],[cx,cy-r,z,'e']])}
function mkPoly(like,pts3,closed){
  if(!closed&&pts3.length===2)return mkLine(like,pts3[0],pts3[1]);
  const flat=[],sn=[];for(const q of pts3){flat.push(q[0],q[1]);sn.push([q[0],q[1],q[2]||0,'e'])}
  return mkLike(like,flat,!!closed,'LWPOLYLINE',{zs:pts3.map(q=>q[2]||0)},sn)}
/* قطعه‌ای از مسیر یک شیء (با حفظ کمان بودن دایره و کمان) */
function pieceOf(p,V,Z,ua,ub,closed){
  const I=p.info;
  if((I.type==='CIRCLE'||I.type==='ARC')&&I.c&&I.r>0){
    const a=ptAt(V,Z,ua,closed),b=ptAt(V,Z,ub,closed),a0=Math.atan2(a[1]-I.c[1],a[0]-I.c[0]),a1=Math.atan2(b[1]-I.c[1],b[0]-I.c[0]);
    const dir=(I.type==='ARC'&&I.sw<0)?-1:1;let sw=a1-a0;
    if(dir>0){while(sw<=1e-9)sw+=2*Math.PI;while(sw>2*Math.PI+1e-9)sw-=2*Math.PI}else{while(sw>=-1e-9)sw-=2*Math.PI;while(sw<-2*Math.PI-1e-9)sw+=2*Math.PI}
    return mkArc(p,I.c[0],I.c[1],I.r,a0,sw,I.c[2]||0)}
  return mkPoly(p,subPath(V,Z,ua,ub,closed),false)}
function applyEdit(dels,adds,msg){
  dels.forEach(o=>setDel(o,true));pushHist('edit',[],{dels,adds});sel=null;selSet=[];edReset();flash(msg);renderPanel();req()}

/* ---- تریم ---- */
function trimPrim(p,wx,wy){
  const V=pathOf(p),Z=pathZ(p),m=V.length-1;if(m<1)return flash('قابل تریم نیست');
  const closed=!!p.closed&&V.length>3||(!!p.closed&&p.info.type==='CIRCLE'),B=boundSegs(p,p.bb),ints=[];
  for(let i=0;i<m;i++){const [ax,ay]=V[i],[bx,by]=V[i+1],lx0=Math.min(ax,bx)-1e-9,lx1=Math.max(ax,bx)+1e-9,ly0=Math.min(ay,by)-1e-9,ly1=Math.max(ay,by)+1e-9;
    for(const s of B){if(Math.max(s[0],s[2])<lx0||Math.min(s[0],s[2])>lx1||Math.max(s[1],s[3])<ly0||Math.min(s[1],s[3])>ly1)continue;
      const r=segX(ax,ay,bx,by,s[0],s[1],s[2],s[3]);if(!r)continue;const [t,u]=r;
      if(t<-1e-9||t>1+1e-9||u<-1e-9||u>1+1e-9)continue;ints.push(i+Math.min(1,Math.max(0,t)))}}
  ints.sort((a,b)=>a-b);const U=[];for(const u of ints)if(!U.length||u-U[U.length-1]>1e-7)U.push(u);
  if(closed&&U.length>1&&U[U.length-1]-U[0]>m-1e-7)U.pop();
  const u0=nearU(V,wx,wy);let lo=null,hi=null;
  for(const u of U){if(u<u0-1e-9)lo=u;else if(u>u0+1e-9&&hi===null)hi=u}
  let adds=[];
  if(closed){
    if(U.length<2)return flash('برای تریم شیء بسته حداقل دو برخورد لازم است');
    if(lo===null)lo=U[U.length-1]-m;if(hi===null)hi=U[0]+m;
    adds=[pieceOf(p,V,Z,hi,lo+m,true)]}
  else{
    if(lo===null&&hi===null)return flash('لبه‌ی برش‌دهنده پیدا نشد');
    if(lo!==null&&lo>1e-7)adds.push(pieceOf(p,V,Z,0,lo,false));
    if(hi!==null&&hi<m-1e-7)adds.push(pieceOf(p,V,Z,hi,m,false))}
  applyEdit([p],adds,'تریم شد')}

/* ---- اکستند ---- */
function extendPrim(p,wx,wy){
  const I=p.info;if(p.closed||I.type==='CIRCLE'||I.type==='ARC'||I.xl)return flash('اکستند فقط برای خط و پلی‌لاین باز است');
  const V=pathOf(p),Z=pathZ(p),m=V.length-1,u0=nearU(V,wx,wy),atEnd=u0>m/2;
  const E=atEnd?V[m]:V[0],Q=atEnd?V[m-1]:V[1];let dx=E[0]-Q[0],dy=E[1]-Q[1];const L=Math.hypot(dx,dy);if(L<1e-12)return flash('قابل اکستند نیست');dx/=L;dy/=L;
  const B=boundSegs(p,[-1e300,-1e300,1e300,1e300]);let best=1e300;
  for(const s of B){const r=segX(E[0],E[1],E[0]+dx,E[1]+dy,s[0],s[1],s[2],s[3]);if(!r)continue;const [t,u]=r;
    if(u<-1e-9||u>1+1e-9||t<1e-7)continue;if(t<best)best=t}
  if(best>1e299)return flash('مرزی برای اکستند پیدا نشد');
  const NV=V.map(q=>q.slice()),i=atEnd?m:0;NV[i]=[E[0]+dx*best,E[1]+dy*best];
  const pts3=NV.map((q,k)=>[q[0],q[1],Z[k]||0]);
  applyEdit([p],[mkPoly(p,pts3,false)],'اکستند شد')}

/* ---- بریک ---- */
function breakPrim(p,a,b){
  const V=pathOf(p),Z=pathZ(p),m=V.length-1,closed=!!p.closed&&V.length>3||(!!p.closed&&p.info.type==='CIRCLE');
  let ua=nearU(V,a.x,a.y),ub=b?nearU(V,b.x,b.y):ua;if(ua>ub){const t=ua;ua=ub;ub=t}
  const adds=[];
  if(closed){if(b&&ub-ua>1e-7)adds.push(pieceOf(p,V,Z,ub,ua+m,true));else adds.push(pieceOf(p,V,Z,ua,ua+m,true))}
  else{if(ua>1e-7)adds.push(pieceOf(p,V,Z,0,ua,false));if(ub<m-1e-7)adds.push(pieceOf(p,V,Z,ub,m,false))}
  if(!adds.length)return flash('چیزی باقی نمی‌ماند');
  applyEdit([p],adds,b?'بریک شد':'در نقطه شکسته شد')}

/* ---- منفجر ---- */
function explodePrim(p){
  if(p.pts.length<6||p.info.type==='CIRCLE'||p.info.type==='ARC'||p.info.xl)return flash('این شیء چند پاره‌خطی نیست');
  const V=pathOf(p),Z=pathZ(p),adds=[];for(let i=0;i<V.length-1;i++)adds.push(mkLine(p,[V[i][0],V[i][1],Z[i]],[V[i+1][0],V[i+1][1],Z[i+1]]));
  applyEdit([p],adds,'به '+adds.length+' خط تبدیل شد')}

/* ---- فیلت و چمفر ---- */
const lineOf=p=>(p&&p.s===undefined&&p.pts.length===4&&!p.closed&&!p.info.ex&&!p.info.xl&&!p.ann)?p.pts:null;
function cornerOf(a,b){
  const L1=lineOf(a.p),L2=lineOf(b.p);if(!L1||!L2)return {err:'فیلت/چمفر فقط بین دو خط ساده است (چندخطی را ابتدا «منفجر» کنید)'};
  if(a.p===b.p)return {err:'دو خط متفاوت انتخاب کنید'};
  const r=segX(L1[0],L1[1],L1[2],L1[3],L2[0],L2[1],L2[2],L2[3]);if(!r)return {err:'دو خط موازی‌اند'};
  const C=[L1[0]+r[0]*(L1[2]-L1[0]),L1[1]+r[0]*(L1[3]-L1[1])];
  const side=(L,wx,wy)=>{let dx=L[2]-L[0],dy=L[3]-L[1];const l=Math.hypot(dx,dy);dx/=l;dy/=l;
    const s=((wx-C[0])*dx+(wy-C[1])*dy)>=0?1:-1,u=[dx*s,dy*s];
    const e=[[L[0],L[1]],[L[2],L[3]]].map(q=>({q,d:(q[0]-C[0])*u[0]+(q[1]-C[1])*u[1]})).sort((x,y)=>y.d-x.d)[0];
    return {u,F:e.q,fd:e.d}};
  const s1=side(L1,a.wx,a.wy),s2=side(L2,b.wx,b.wy);
  const cs=s1.u[0]*s2.u[0]+s1.u[1]*s2.u[1];if(Math.abs(cs)>0.99999)return {err:'زاویه‌ی بین دو خط مناسب نیست'};
  return {C,s1,s2,th:Math.acos(cs),z1:(a.p.info.z&&a.p.info.z[0])||0,z2:(b.p.info.z&&b.p.info.z[0])||0}}
function filletDo(a,b,chamfer){
  const k=cornerOf(a,b);if(k.err)return flash(k.err);const {C,s1,s2,th}=k,adds=[];
  let T1,T2;
  if(chamfer){T1=[C[0]+s1.u[0]*ED.d1,C[1]+s1.u[1]*ED.d1];T2=[C[0]+s2.u[0]*ED.d2,C[1]+s2.u[1]*ED.d2]}
  else if(ED.fr>0){const d=ED.fr/Math.tan(th/2);T1=[C[0]+s1.u[0]*d,C[1]+s1.u[1]*d];T2=[C[0]+s2.u[0]*d,C[1]+s2.u[1]*d]}
  else{T1=T2=C}
  const d1=Math.hypot(T1[0]-C[0],T1[1]-C[1]),d2=Math.hypot(T2[0]-C[0],T2[1]-C[1]);
  if(d1>=s1.fd-1e-9||d2>=s2.fd-1e-9)return flash('فاصله/شعاع از طول خط بیشتر است');
  adds.push(mkLine(a.p,[s1.F[0],s1.F[1],k.z1],[T1[0],T1[1],k.z1]),mkLine(b.p,[s2.F[0],s2.F[1],k.z2],[T2[0],T2[1],k.z2]));
  if(chamfer){if(d1>1e-12||d2>1e-12)adds.push(mkLine(a.p,[T1[0],T1[1],k.z1],[T2[0],T2[1],k.z1]))}
  else if(ED.fr>0){const bx=s1.u[0]+s2.u[0],by=s1.u[1]+s2.u[1],bl=Math.hypot(bx,by),dist=ED.fr/Math.sin(th/2),O=[C[0]+bx/bl*dist,C[1]+by/bl*dist];
    const a1=Math.atan2(T1[1]-O[1],T1[0]-O[0]),a2=Math.atan2(T2[1]-O[1],T2[0]-O[0]);let sw=a2-a1;while(sw>Math.PI)sw-=2*Math.PI;while(sw<-Math.PI)sw+=2*Math.PI;
    adds.push(mkArc(a.p,O[0],O[1],ED.fr,a1,sw,k.z1))}
  applyEdit([a.p,b.p],adds,chamfer?'چمفر شد':(ED.fr>0?'فیلت شد':'گوشه بسته شد'))}

/* ---- آفست ---- */
function offsetDo(p,wx,wy){
  const d=ED.od;if(!(d>0))return flash('فاصله را وارد کنید');const I=p.info;let np=null;
  if((I.type==='CIRCLE'||I.type==='ARC')&&I.c){
    const inside=Math.hypot(wx-I.c[0],wy-I.c[1])<I.r,r2=inside?I.r-d:I.r+d;if(r2<=0)return flash('فاصله از شعاع بیشتر است');
    if(I.type==='CIRCLE')np=mkCircle(p,I.c[0],I.c[1],r2,I.c[2]||0);
    else{const a0=Math.atan2(p.pts[1]-I.c[1],p.pts[0]-I.c[0]);np=mkArc(p,I.c[0],I.c[1],r2,a0,I.sw,I.c[2]||0)}}
  else if(p.pts.length>=4&&!I.xl){
    let V=pathOf(p),Z=pathZ(p);const closed=!!p.closed&&V.length>3;
    const W=[],WZ=[];for(let i=0;i<V.length;i++){if(i&&Math.hypot(V[i][0]-V[i-1][0],V[i][1]-V[i-1][1])<1e-12)continue;W.push(V[i]);WZ.push(Z[i])}
    const nv=closed?W.length-1:W.length;if(nv<2)return flash('قابل آفست نیست');
    const u0=nearU(W,wx,wy),i0=Math.min(Math.floor(u0),W.length-2),A=W[i0],Bq=W[i0+1];
    const side=((Bq[0]-A[0])*(wy-A[1])-(Bq[1]-A[1])*(wx-A[0]))>=0?1:-1;
    const sd=side*d,segs=[];
    for(let i=0;i<W.length-1;i++){const a=W[i],b=W[i+1],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy),nx=-dy/l*sd,ny=dx/l*sd;segs.push([a[0]+nx,a[1]+ny,b[0]+nx,b[1]+ny])}
    const out=[];const ix=(s,t,fb)=>{const r=segX(s[0],s[1],s[2],s[3],t[0],t[1],t[2],t[3]);if(!r)return fb;const q=[s[0]+r[0]*(s[2]-s[0]),s[1]+r[0]*(s[3]-s[1])];
      return Math.hypot(q[0]-fb[0],q[1]-fb[1])>12*d?fb:q};
    const M=segs.length;
    if(closed){for(let k=0;k<M;k++){const s=segs[(k+M-1)%M],t=segs[k];const q=ix(s,t,[t[0],t[1]]);out.push([q[0],q[1],WZ[k]])}}
    else{out.push([segs[0][0],segs[0][1],WZ[0]]);for(let k=1;k<M;k++){const q=ix(segs[k-1],segs[k],[segs[k][0],segs[k][1]]);out.push([q[0],q[1],WZ[k]])}out.push([segs[M-1][2],segs[M-1][3],WZ[M]])}
    np=mkPoly(p,out,closed)}
  else return flash('این شیء آفست‌پذیر نیست');
  pushHist('add',[np]);flash('آفست ساخته شد');edReset();renderPanel();req()}

/* ---- جابجایی و کپی ---- */
function shiftInfo(I,dx,dy){const J=Object.assign({},I);delete J.mine;
  if(I.c)J.c=[I.c[0]+dx,I.c[1]+dy,I.c[2]];
  if(I.ex){J.ex=Object.assign({},I.ex);if(I.ex.c)J.ex.c=[I.ex.c[0]+dx,I.ex.c[1]+dy,I.ex.c[2]]}
  if(I.xl)J.xl=Object.assign({},I.xl,{x:I.xl.x+dx,y:I.xl.y+dy});return J}
function mvCopy(dx,dy,copy){
  const items=[...new Set(selSet)].filter(o=>!o.ann),skip=selSet.some(o=>o.ann);
  if(!items.length)return flash('شیء قابل جابجایی انتخاب نشده');
  const dels=[],adds=[];
  for(const o of items){
    if(o.s!==undefined){const t=addUserText(o.x+dx,o.y+dy,o.z,o.h,o.s,{rot:o.rot,col:o.col,ah:o.ah,av:o.av,f:o.f,xs:o.xs});t.b=o.b;adds.push(t)}
    else{const P=o.pts,flat=P.map((v,i)=>v+(i%2?dy:dx));
      let sn;if(o._sn)sn=o._sn.map(q=>[q[0]+dx,q[1]+dy,q[2],q[3]]);else{sn=[];const st=Math.max(2,Math.ceil(P.length/2/400))*2;for(let i=0;i<P.length;i+=st)sn.push([flat[i],flat[i+1],0,'e']);if(o.info.c)sn.push([o.info.c[0]+dx,o.info.c[1]+dy,o.info.c[2]||0,'c'])}
      const np=mkLike(o,flat,o.closed,o.info.type,shiftInfo(o.info,dx,dy),sn);adds.push(np)}
    if(!copy)dels.push(o)}
  dels.forEach(o=>setDel(o,true));pushHist('edit',[],{dels,adds});
  selSet=copy?selSet:adds.slice();pts=[];tent=null;flash((copy?'کپی شد ':'جابجا شد ')+(skip?'(مجموعه‌های دایمنشن و برچسب جابجا نمی‌شوند)':''));renderPanel();req()}

/* ---- دایره و خط بی‌نهایت ---- */
function mkXline(x,y,dx,dy,z){
  const L=Math.hypot(dx,dy);if(!(L>0))return null;dx/=L;dy/=L;const D=1e7;
  return addUserPrim([x-dx*D,y-dy*D,x+dx*D,y+dy*D],false,'XLINE',{xl:{x,y,dx,dy},z:[z||0,z||0]},[[x,y,z||0,'e'],[x+dx,y+dy,z||0,'e']],0x00bfff)}
function xlClip(p,x0,y0,x1,y1){
  const P=p.pts,dx=P[2]-P[0],dy=P[3]-P[1],mg=(x1-x0)*0.05+1e-9;let t0=0,t1=1;
  const pp=[-dx,dx,-dy,dy],qq=[P[0]-(x0-mg),(x1+mg)-P[0],P[1]-(y0-mg),(y1+mg)-P[1]];
  for(let i=0;i<4;i++){if(pp[i]===0){if(qq[i]<0)return null}else{const r=qq[i]/pp[i];if(pp[i]<0){if(r>t1)return null;if(r>t0)t0=r}else{if(r<t0)return null;if(r<t1)t1=r}}}
  return [P[0]+dx*t0,P[1]+dy*t0,P[0]+dx*t1,P[1]+dy*t1]}
function cxAuto(){
  if(tool==='circ'&&pts.length>=2){const c=pts[0],r=Math.hypot(pts[1].x-c.x,pts[1].y-c.y);pts=[];if(!(r>0))return flash('شعاع صفر است');
    const pr=mkCircle({col:0xffa500,lc:1,L:DB.mk},c.x,c.y,r,c.z||0);pushHist('add',[pr]);flash('دایره رسم شد')}
  else if(tool==='xl'&&pts.length>=2){const a=pts[0],b=pts[1];pts=[];const pr=mkXline(a.x,a.y,b.x-a.x,b.y-a.y,a.z||0);if(!pr)return flash('دو نقطه یکی است');pushHist('add',[pr]);flash('خط بی‌نهایت رسم شد')}
  else if((tool==='mov'||tool==='cpy')&&pts.length>=2){const a=pts[0],b=pts[1];pts=[];mvCopy(b.x-a.x,b.y-a.y,tool==='cpy')}}
function cxPanel(){let h='';
  if(tool==='circ'){
    if(!pts.length&&!tent)h+='<div class="hint">مرکز دایره را مشخص کنید</div>';
    else if(pts.length<2&&!(pts.length===1&&tent))h+='<div class="hint">یک نقطه روی دایره را مشخص کنید یا شعاع را بنویسید</div>';
    const c=pts[0],q=pts.length>=2?pts[1]:(tent&&pts.length===1?tent:null);
    if(c&&q){const r=Math.hypot(q.x-c.x,q.y-c.y);h+=row('شعاع',f(r),'big')+row('قطر',f(2*r))+row('محیط',f(2*Math.PI*r))}
    h+=`<div class="fl keep"><label for="cxR">شعاع (عددی)</label><input type="number" id="cxR" inputmode="decimal" step="any" value="${ED.cr||''}"></div>`;
    h+=btns([['confirm','✓ ثبت نقطه',!tent,1],['ed:circr','رسم با شعاع عددی',!pts.length],['undo','↶ حذف آخرین',!pts.length],['clear','لغو',!pts.length&&!tent]])}
  else{
    h+=`<div class="hint">${!pts.length&&!tent?'نقطه‌ی عبور خط را مشخص کنید':'نقطه‌ی دوم (جهت خط) را مشخص کنید، یا «افقی / عمودی» را بزنید'}</div>`;
    h+=btns([['confirm','✓ ثبت نقطه',!tent,1],['ed:xlh','افقی',!pts.length&&!tent],['ed:xlv','عمودی',!pts.length&&!tent],['undo','↶ حذف آخرین',!pts.length],['clear','لغو',!pts.length&&!tent]])}
  return h}
function edPanel(){let h='';const hint=t=>'<div class="hint">'+t+'</div>';
  const fld=(id,lb,v)=>`<div class="fl keep"><label for="${id}">${lb}</label><input type="number" id="${id}" inputmode="decimal" step="any" min="0" value="${v}"></div>`;
  if(tool==='era')h+=hint('روی شیء ضربه بزنید تا پاک شود (برگرداندن ↶ بالای صفحه)');
  else if(tool==='trm')h+=hint('روی بخشی از خط/کمان/دایره که می‌خواهید حذف شود ضربه بزنید؛ تا نزدیک‌ترین برخورد با اشیای دیگر بریده می‌شود');
  else if(tool==='ext')h+=hint('نزدیک انتهایی که باید کشیده شود روی خط ضربه بزنید؛ تا اولین شیء مقابل ادامه می‌یابد');
  else if(tool==='xpl')h+=hint('روی یک پلی‌لاین یا مستطیل ضربه بزنید تا به خط‌های جدا تبدیل شود');
  else if(tool==='brk'){
    h+=hint(ed.step===0?'روی شیئی که باید شکسته شود ضربه بزنید':ed.step===1?'نقطه‌ی اول شکستن را مشخص کنید (یا «شکستن در یک نقطه»)':'نقطه‌ی دوم را مشخص کنید؛ بین دو نقطه حذف می‌شود');
    h+=btns([['ed:b1','شکستن در همین نقطه',ed.step<2,0],['ed:reset','لغو',ed.step===0]])}
  else if(tool==='fil'){h+=fld('edFr','شعاع فیلت (۰ = گوشه‌ی تیز)',ED.fr)+hint(ed.a?'روی خط دوم (نزدیک بخشی که می‌ماند) ضربه بزنید':'روی خط اول (نزدیک بخشی که می‌ماند) ضربه بزنید');h+=btns([['ed:reset','لغو',!ed.a]])}
  else if(tool==='chm'){h+=fld('edD1','فاصله‌ی اول',ED.d1)+fld('edD2','فاصله‌ی دوم',ED.d2)+hint(ed.a?'روی خط دوم ضربه بزنید':'روی خط اول ضربه بزنید');h+=btns([['ed:reset','لغو',!ed.a]])}
  else if(tool==='off'){h+=fld('edOd','فاصله‌ی آفست',ED.od)+hint(ed.o?'سمت آفست را با ضربه‌ی کنار شیء مشخص کنید':'روی شیء (خط، پلی‌لاین، دایره، کمان) ضربه بزنید');h+=btns([['ed:reset','شیء دیگر',!ed.o]])}
  else if(tool==='mov'||tool==='cpy'){
    if(!selSet.length)h+=hint('ابتدا با ابزار «انتخاب» شیءها را انتخاب کنید')+btns([['ed:tosel','⛶ رفتن به انتخاب',0,1]]);
    else h+=hint(`${new Set(selSet).size} شیء انتخاب شده — ${pts.length?'مقصد را':'نقطه‌ی مبدأ را'} مشخص و «ثبت نقطه» را بزنید`)+btns([['confirm','✓ ثبت نقطه',!tent,1],['undo','↶ حذف آخرین',!pts.length],['clear','لغو',!pts.length&&!tent]])}
  return h}
function edAct(a){
  if(a==='reset'){edReset()}
  else if(a==='tosel'){setTool('sel')}
  else if(a==='mvgo'){setTool('mov')}
  else if(a==='cpgo'){setTool('cpy')}
  else if(a==='b1'){if(ed.o&&ed.p1)breakPrim(ed.o,ed.p1,null)}
  else if(a==='circr'){const c=pts[0]||tent;if(c&&ED.cr>0){const pr=mkCircle({col:0xffa500,lc:1,L:DB.mk},c.x,c.y,ED.cr,c.z||0);pts=[];tent=null;pushHist('add',[pr]);flash('دایره رسم شد')}else flash('مرکز و شعاع را مشخص کنید')}
  else if(a==='xlh'||a==='xlv'){const c=pts[0]||tent;if(c){const pr=a==='xlh'?mkXline(c.x,c.y,1,0,c.z||0):mkXline(c.x,c.y,0,1,c.z||0);pts=[];tent=null;pushHist('add',[pr]);flash('خط بی‌نهایت رسم شد')}}}
function edTap(x,y){
  const [wx,wy]=s2w(x,y);
  if(tool==='brk'&&ed.step>=1){const sn=snapAt(x,y);
    if(ed.step===1){ed.p1={x:sn.x,y:sn.y};ed.step=2;renderPanel();req();return}
    breakPrim(ed.o,ed.p1,{x:sn.x,y:sn.y});return}
  const o=pickEntity(x,y);
  if(!o){flash('شیئی پیدا نشد');return}
  if(tool==='era'){const L=expandAnn([o]);L.forEach(q=>setDel(q,true));pushHist('del',L);sel=null;flash('پاک شد');renderPanel();req();return}
  if(o.s!==undefined){flash('این ابزار برای متن نیست');return}
  if(o.ann){flash('این شیء بخشی از دایمنشن یا برچسب است');return}
  if(tool==='trm')trimPrim(o,wx,wy);
  else if(tool==='ext')extendPrim(o,wx,wy);
  else if(tool==='xpl')explodePrim(o);
  else if(tool==='brk'){ed.o=o;ed.step=1;sel=o;renderPanel();req()}
  else if(tool==='fil'||tool==='chm'){
    if(!ed.a){ed.a={p:o,wx,wy};sel=o;renderPanel();req()}
    else{const a=ed.a;ed.a=null;sel=null;filletDo(a,{p:o,wx,wy},tool==='chm')}}
  else if(tool==='off'){
    if(!ed.o){ed.o=o;sel=o;renderPanel();req()}else offsetDo(ed.o,wx,wy)}}
$('panel').addEventListener('input',e=>{const id=e.target.id,v=parseFloat(e.target.value);
  if(id==='edFr')ED.fr=v>=0?v:0;else if(id==='edD1')ED.d1=v>=0?v:0;else if(id==='edD2')ED.d2=v>=0?v:0;else if(id==='edOd')ED.od=v>0?v:0;else if(id==='cxR'){ED.cr=v>0?v:0;req()}});
function cxOverlay(live,pts,tent){
  if(tool==='circ'){const c=pts[0];let r=0;
    if(c&&live.length>=2)r=Math.hypot(live[1].x-c.x,live[1].y-c.y);else if(c&&ED.cr>0)r=ED.cr;
    if(c&&r>0){const [a,b]=w2s(c.x,c.y);g.save();g.strokeStyle='#ffd23f';g.lineWidth=2;g.setLineDash([6,4]);g.beginPath();g.arc(a,b,r*view.s,0,7);g.stroke();
      if(live.length>=2){const [qa,qb]=w2s(live[1].x,live[1].y);g.beginPath();g.moveTo(a,b);g.lineTo(qa,qb);g.stroke()}g.restore()}
    pts.forEach(p=>{const [a,b]=w2s(p.x,p.y);g.fillStyle='#ffd23f';g.beginPath();g.arc(a,b,4,0,7);g.fill()})}

    if(live.length>=2){const [a,b]=w2s(live[0].x,live[0].y),[c,d]=w2s(live[1].x,live[1].y),L=Math.hypot(c-a,d-b);
      if(L>1){const ux=(c-a)/L*6000,uy=(d-b)/L*6000;g.save();g.strokeStyle='#ffd23f';g.lineWidth=1.5;g.setLineDash([8,5]);g.beginPath();g.moveTo(a-ux,b-uy);g.lineTo(a+ux,b+uy);g.stroke();g.restore()}}}
  else if((tool==='mov'||tool==='cpy')&&pts.length&&live.length>=2){
    const [a,b]=w2s(live[0].x,live[0].y),[c,d]=w2s(live[live.length-1].x,live[live.length-1].y);
    g.save();g.strokeStyle='#33ff99';g.lineWidth=2;g.setLineDash([6,4]);g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();g.restore()}
  else if(EDT[tool]&&ed.o){g.save();g.strokeStyle='#ffd23f';g.lineWidth=3;g.beginPath();const P=ed.o.pts;let [a,b]=w2s(P[0],P[1]);g.moveTo(a,b);for(let i=2;i<P.length;i+=2){[a,b]=w2s(P[i],P[i+1]);g.lineTo(a,b)}if(ed.o.closed)g.closePath();g.stroke();g.restore();
    if(ed.p1){const [a,b]=w2s(ed.p1.x,ed.p1.y);g.fillStyle='#33ff99';g.beginPath();g.arc(a,b,5,0,7);g.fill()}}}

/* ---- نمایش متن‌های کوچک: خوانا و بدون پرش ---- */
function drawTexts(s,x0,y0,x1,y1,w2s){
  g.textBaseline='alphabetic';const mn=+S.minTxt||0,lo=Math.max(mn,3.5),CS=80,grid=new Map();
  const rectOf=(t,px,sx,sy)=>{const lines=(t.s||'').split('\n'),ml=lines.reduce((m,l)=>Math.max(m,l.length),1),w=px*0.55*ml,hh=px*1.3*lines.length;
    const xl=t.ah==='center'?sx-w/2:t.ah==='right'?sx-w:sx;return [xl,sy-hh,xl+w,sy+hh*0.2]};
  const put=r=>{for(let gx=Math.floor(r[0]/CS);gx<=Math.floor(r[2]/CS);gx++)for(let gy=Math.floor(r[1]/CS);gy<=Math.floor(r[3]/CS);gy++){const k=gx+','+gy;let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(r)}};
  const hit=r=>{for(let gx=Math.floor(r[0]/CS);gx<=Math.floor(r[2]/CS);gx++)for(let gy=Math.floor(r[1]/CS);gy<=Math.floor(r[3]/CS);gy++){const a=grid.get(gx+','+gy);if(a)for(const q of a)if(!(q[2]<r[0]||q[0]>r[2]||q[3]<r[1]||q[1]>r[3]))return true}return false};
  const small=[];
  for(const t of DB.texts){
    if(!t.L.on||t.del)continue;const px=t.h*s,mg=t.h*40;if(t.x<x0-mg||t.x>x1+mg||t.y<y0-mg||t.y>y1+mg)continue;
    if(px>=lo){const [sx,sy]=w2s(t.x,t.y);paintText(t,s,sx,sy,dispCol(t.col));if(px>=4)put(rectOf(t,px,sx,sy))}
    else if(mn>0&&px>=mn*0.3)small.push(t)}
  small.sort((a,b)=>b.h-a.h||a.x-b.x||a.y-b.y);
  for(const t of small){const [sx,sy]=w2s(t.x,t.y),r=rectOf(t,mn,sx,sy);if(hit(r))continue;put(r);paintText(t,mn/t.h,sx,sy,dispCol(t.col),true)}}

let setTab='disp';
function openSettings(tab){
  if(tab)setTab=tab;
  const TABS={disp:'نمایش',txt:'متن',snap:'اسنپ',sty:'استایل‌ها',file:'فایل',about:'درباره'};
  const L=(t,body)=>`<div class="lr"><span class="nm" style="text-align:right;direction:rtl">${t}</span>${body}</div>`;
  const CK=(id,t,on)=>`<label class="lr"><input type="checkbox" id="${id}" ${on?'checked':''}><span class="nm" style="direction:rtl;text-align:right">${t}</span></label>`;
  let b='';
  if(setTab==='disp')b=L('تعداد رقم اعشار',`<select id="sDec">${[0,1,2,3,4,5,6].map(n=>`<option ${n===S.dec?'selected':''}>${n}</option>`).join('')}</select>`)+CK('sD','پس‌زمینه‌ی تیره',S.dark)
    +L('حالت برنامه',`<select id="sMode">${opts({edit:'ویرایش',view:'خواندنی (فقط نمایش و اندازه‌گیری)'},S.mode)}</select>`)
    +L('حداقل اندازه‌ی متن روی صفحه',`<select id="sMin">${opts({0:'خاموش',6:'۶ پیکسل',8:'۸ پیکسل',10:'۱۰ پیکسل',12:'۱۲ پیکسل',14:'۱۴ پیکسل'},S.minTxt)}</select>`)
    +'<div class="sn">متن‌های ریزتر از این اندازه، با لبه‌ی روشن و بدون روی هم افتادن بزرگ می‌شوند؛ متن‌های خیلی ریز و شلوغ دیده نمی‌شوند تا بزرگ‌نمایی کنید.</div>';
  else if(setTab==='txt')b=L('فونت متن‌های نقشه',`<select id="sFont">${opts(FONTS,S.font)}</select>`)+L('فونت حروف لاتین و اعداد انگلیسی',`<select id="sLat">${opts(LATS,S.lat)}</select>`)
    +L('ترتیب حروف فارسی',`<select id="sPtx">${opts({normal:'عادی',rev:'وارونه (اگر متن برعکس دیده می‌شود)'},S.ptxt)}</select>`)
    +'<div class="sn">فونت‌های فارسی فقط حروف فارسی و عدد را عوض می‌کنند؛ برای حروف لاتین فونت جدا انتخاب کنید.</div>';
  else if(setTab==='snap')b=CK('sSnap','فعال بودن اسنپ',S.snap)+CK('sE','اسنپ به انتها / رأس / نقطه‌ی درج',S.snapE)+CK('sM','اسنپ به وسط',S.snapM)+CK('sC','اسنپ به مرکز دایره/کمان',S.snapC);
  else if(setTab==='sty')b='<div class="btns"><button id="sDS">🎨 استایل دایمنشن</button><button id="sTS">🔤 استایل متن</button><button id="sCS">🧭 سبک مختصات</button></div>';
  else if(setTab==='file')b='<div class="btns"><button id="xMine">💾 ذخیره‌ی ترسیم‌ها و متن‌های من</button><button id="xAll">💾 ذخیره‌ی کل نقشه (ساده‌شده)</button></div><div class="sn">خروجی، فایل DXF متنی است و در اتوکد باز می‌شود. اگر گوشی پنجره‌ی اشتراک‌گذاری باز کرد، «ذخیره در فایل‌ها» را بزنید.</div><h3 style="margin-top:14px">گزارش فایل</h3>'+(DB?reportHTML():'<div class="sn">فایلی باز نیست</div>');
  else b=`<div class="ver" style="text-align:right">نسخه‌ی ${APP_VER}</div><ul style="padding-right:18px;line-height:1.9">${NEWS.map(x=>'<li>'+x+'</li>').join('')}</ul>`;
  openSheet(`<h3>تنظیمات</h3><div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button data-tab="${k}" class="${k===setTab?'on':''}">${v}</button>`).join('')}</div>${b}`);
  const bx=$('sheetBox');
  bx.querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>openSettings(t.dataset.tab));
  bx.onchange=()=>{const g2=id=>$(id);
    if(g2('sDec'))S.dec=+g2('sDec').value;if(g2('sSnap'))S.snap=g2('sSnap').checked;if(g2('sE'))S.snapE=g2('sE').checked;if(g2('sM'))S.snapM=g2('sM').checked;if(g2('sC'))S.snapC=g2('sC').checked;
    if(g2('sD'))S.dark=g2('sD').checked;if(g2('sFont'))S.font=g2('sFont').value;if(g2('sLat'))S.lat=g2('sLat').value;if(g2('sPtx'))S.ptxt=g2('sPtx').value;if(g2('sMin'))S.minTxt=+g2('sMin').value;
    if(g2('sMode')&&g2('sMode').value!==S.mode){S.mode=g2('sMode').value;setTool('pan');applyMode()}
    syncChips();saveCfg();renderPanel();req()};
  const ex=only=>{if(!DB)return msg('ذخیره','ابتدا یک فایل باز کنید.');const base=(fileName||'map').replace(/\.[^.]+$/,'');saveText(base+(only?'-markup':'-edit')+'.dxf',buildDXF(only))};
  if($('xMine'))$('xMine').onclick=()=>ex(true);if($('xAll'))$('xAll').onclick=()=>ex(false);
  if($('sDS'))$('sDS').onclick=openDS;if($('sTS'))$('sTS').onclick=openTS;if($('sCS'))$('sCS').onclick=openCS}

function setDB(d,name){d.anns=[];DB=d;fileName=name;tool='pan';pts=[];tent=null;log=[];sel=null;hover=null;hist=[];updUndo();
  d.mk=d.layers.find(l=>l.name==='MARKUP')||{name:'MARKUP',color:0xffa500,on:true,count:0};if(!d.layers.includes(d.mk))d.layers.push(d.mk);
  selSet=[];dimArc=null;box=null;setTool('pan');
  $('fname').textContent=name;$('empty').style.display='none';renderPanel();resize();zoomExtents();
  const sk=Object.entries(d.skipped);
  if(!d.prims.length&&!d.texts.length)msg('خالی','موجودیت قابل نمایشی پیدا نشد.'+(sk.length?'<br>نوع‌های پشتیبانی‌نشده: <span dir="ltr">'+sk.map(([k,v])=>k+'×'+v).join(', ')+'</span>':''));
  else if(sk.length)flash('بعضی موجودیت‌ها نمایش داده نشد: '+sk.map(([k])=>k).join(', '))}
function openBuffer(buf,name){
  const u8=new Uint8Array(buf),head=String.fromCharCode.apply(null,u8.subarray(0,22));
  if(head.startsWith('AutoCAD Binary DXF'))return msg('DXF باینری','این DXF از نوع باینری است. هنگام ذخیره/تبدیل، گزینه‌ی <b>ASCII DXF</b> را انتخاب کنید.');
  if(/^AC10\d\d/.test(head))return msg('فایل DWG است','مرورگر نمی‌تواند DWG را مستقیم باز کند. فایل را با <b>ODA File Converter</b> (رایگان، روی کامپیوتر) یا هر مبدل دیگر به <b>ASCII DXF</b> (ترجیحاً نسخه‌ی R2000 یا 2004) تبدیل کنید و همان را اینجا باز کنید.');
  let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(u8)}catch(_){try{text=new TextDecoder('windows-1256').decode(u8)}catch(__){text=new TextDecoder('utf-8').decode(u8)}}
  if(!/^\s*0\s*\n\s*SECTION/m.test(text.slice(0,2000)))return msg('فرمت نامعتبر','این فایل شبیه DXF متنی نیست.');
  const D=parseDXF(text);D.srcText=text;setDB(D,name);}
function loadFile(file){
  flash('در حال بارگذاری…');const fr=new FileReader();
  fr.onload=()=>setTimeout(()=>{try{openBuffer(fr.result,file.name)}catch(err){msg('خطا در خواندن فایل',String(err&&err.message||err))}},30);
  fr.onerror=()=>msg('خطا','فایل خوانده نشد.');fr.readAsArrayBuffer(file)}
$('file').addEventListener('change',e=>{const fl=e.target.files[0];if(fl)loadFile(fl);e.target.value=''});
